<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="bg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bb" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="ball" cx="0.38" cy="0.38">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fcb900"/>
      <stop offset="100%" stop-color="#805000"/>
    </radialGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2d1750"/>
    </linearGradient>
  </defs>

  <!-- Badge background (dark, like game canvas) -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="#0a0a15"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="#7c3aed" stroke-width="2.5" opacity="0.5"/>

  <!-- Starfield -->
  <circle cx="18" cy="18" r="0.8" fill="#c8dcff" opacity="0.5"/>
  <circle cx="42" cy="14" r="1" fill="#c8dcff" opacity="0.4"/>
  <circle cx="75" cy="20" r="0.7" fill="#c8dcff" opacity="0.45"/>
  <circle cx="88" cy="12" r="0.9" fill="#c8dcff" opacity="0.35"/>
  <circle cx="55" cy="10" r="0.6" fill="#c8dcff" opacity="0.3"/>

  <!-- Top brick row (3 bricks) -->
  <!-- Gold -->
  <g filter="url(#bg)">
   <rect x="10" y="32" width="24" height="14" rx="2" fill="#fcb900" opacity="0.9"/>
  </g>
  <rect x="10" y="32" width="24" height="14" rx="2" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="0.8"/>
  <rect x="11" y="33" width="22" height="3" rx="1.5" fill="rgba(255,255,255,0.14)"/>

  <!-- Purple (cracked — being hit) -->
  <g filter="url(#bg)">
   <rect x="38" y="32" width="24" height="14" rx="2" fill="#7c3aed"/>
  </g>
  <rect x="38" y="32" width="24" height="14" rx="2" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="0.8"/>
  <rect x="39" y="33" width="22" height="3" rx="1.5" fill="rgba(255,255,255,0.12)"/>
  <!-- Crack -->
  <line x1="44" y1="32" x2="54" y2="46" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <line x1="54" y1="32" x2="50" y2="46" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

  <!-- Gold -->
  <g filter="url(#bg)">
   <rect x="66" y="32" width="24" height="14" rx="2" fill="#fcb900" opacity="0.9"/>
  </g>
  <rect x="66" y="32" width="24" height="14" rx="2" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="0.8"/>
  <rect x="67" y="33" width="22" height="3" rx="1.5" fill="rgba(255,255,255,0.14)"/>

  <!-- Paddle -->
  <g filter="url(#bg)">
   <rect x="18" y="80" width="64" height="12" rx="6" fill="url(#pad)"/>
  </g>

  <!-- Ball (glowing gold, radial gradient) -->
  <g filter="url(#bb)">
   <circle cx="72" cy="68" r="9" fill="url(#ball)"/>
  </g>

  <!-- Ball trail -->
  <circle cx="52" cy="78" r="3.5" fill="#fcb900" opacity="0.3"/>
  <circle cx="60" cy="74" r="5" fill="#fcb900" opacity="0.45"/>
</svg>
