<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Badge background (dark game screen) -->
  <rect x="4" y="4" width="92" height="92" rx="18" fill="#1a1a2e" stroke="#7c3aed" stroke-width="2.5"/>

  <!-- Bricks (3 rows) -->
  <!-- Row 1 -->
  <rect x="14" y="16" width="22" height="13" rx="2" fill="#7c3aed"/>
  <rect x="39" y="16" width="22" height="13" rx="2" fill="#fcb900"/>
  <rect x="64" y="16" width="22" height="13" rx="2" fill="#7c3aed"/>

  <!-- Row 2 — center cracked -->
  <rect x="14" y="32" width="22" height="13" rx="2" fill="#fcb900"/>
  <rect x="39" y="32" width="22" height="13" rx="2" fill="#7c3aed"/>
  <line x1="45" y1="32" x2="55" y2="45" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="32" x2="49" y2="45" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="64" y="32" width="22" height="13" rx="2" fill="#fcb900"/>

  <!-- Row 3 -->
  <rect x="14" y="48" width="22" height="13" rx="2" fill="#7c3aed"/>
  <rect x="39" y="48" width="22" height="13" rx="2" fill="#fcb900"/>
  <rect x="64" y="48" width="22" height="13" rx="2" fill="#7c3aed"/>

  <!-- Paddle -->
  <rect x="24" y="76" width="52" height="8" rx="4" fill="#a78bfa"/>

  <!-- Ball mid-flight -->
  <circle cx="60" cy="66" r="7" fill="#fcb900"/>
  <circle cx="58" cy="64" r="2.5" fill="#fff" opacity="0.45"/>

  <!-- Ball trail -->
  <circle cx="38" cy="76" r="2.5" fill="#fcb900" opacity="0.35"/>
  <circle cx="46" cy="73" r="3.5" fill="#fcb900" opacity="0.5"/>
  <circle cx="53" cy="70" r="4.5" fill="#fcb900" opacity="0.6"/>
</svg>
