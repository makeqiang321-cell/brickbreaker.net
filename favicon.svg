<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Top brick row (intact) -->
  <rect x="8" y="10" width="26" height="13" rx="2" fill="#fcb900"/>
  <rect x="37" y="10" width="26" height="13" rx="2" fill="#7c3aed"/>
  <rect x="66" y="10" width="26" height="13" rx="2" fill="#fcb900"/>

  <!-- Middle brick row (center being destroyed) -->
  <rect x="8" y="25" width="26" height="13" rx="2" fill="#7c3aed"/>
  <!-- Exploding fragments -->
  <rect x="37" y="20" width="8" height="6" rx="1.2" fill="#7c3aed" transform="rotate(-30 41 23)" opacity="0.7"/>
  <rect x="49" y="16" width="6" height="5" rx="1" fill="#7c3aed" transform="rotate(45 52 18)" opacity="0.5"/>
  <rect x="46" y="24" width="6" height="4" rx="1" fill="#fcb900" transform="rotate(10 49 26)" opacity="0.6"/>
  <rect x="54" y="28" width="7" height="5" rx="1" fill="#7c3aed" transform="rotate(-55 57 30)" opacity="0.5"/>
  <rect x="66" y="25" width="26" height="13" rx="2" fill="#fcb900"/>

  <!-- Bottom brick row -->
  <rect x="8" y="40" width="26" height="13" rx="2" fill="#fcb900"/>
  <rect x="37" y="40" width="26" height="13" rx="2" fill="#7c3aed"/>
  <rect x="66" y="40" width="26" height="13" rx="2" fill="#fcb900"/>

  <!-- Ball (smashing into center wall) -->
  <circle cx="55" cy="52" r="8" fill="#fcb900"/>
  <circle cx="52" cy="49" r="2.8" fill="#fff" opacity="0.45"/>

  <!-- Ball trail -->
  <circle cx="78" cy="60" r="4.5" fill="#fcb900" opacity="0.3"/>
  <circle cx="68" cy="56" r="6" fill="#fcb900" opacity="0.5"/>

  <!-- Impact burst -->
  <line x1="38" y1="26" x2="32" y2="18" stroke="#fcb900" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="47" y1="18" x2="46" y2="8" stroke="#fcb900" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="58" y1="22" x2="64" y2="15" stroke="#fcb900" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
