            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            if (!soundOn || !audioCtx) return;
            try {
                var t = audioCtx.currentTime;
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.type = type || 'square';
                osc.frequency.setValueAtTime(freq, t);
                if (glide) osc.frequency.linearRampToValueAtTime(freq * glide, t + dur);
                gain.gain.setValueAtTime(vol || 0.06, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + dur);
            } catch(e) {}
        }

        var BRICK_DEFS = {
            normal:  { hits: 1, color: NEON.cyan,   glow: 'rgba(124,58,237,0.6)', points: 10 },

        function createBall(x, y) {

        function initState() {

        function resetAfterLife() {

        // ── LEVELS ───────────────────────────────────
        function createLevel() {
            bricks = []; powerups = []; particles = []; floatTexts = [];
            var bRows = CFG.brickRows;
            var bCols = CFG.brickCols;

            // Classic / Neon / Cosmic: standard progressive layouts
            if (MODE === 'classic' || MODE === 'neon' || MODE === 'cosmic') {
                var layouts = [
                    function() { for (var r = 0; r < 5; r++) for (var c = 0; c < bCols; c++) addBrick(c, r, 'normal'); },
                    function() { for (var r = 0; r < bRows; r++) for (var c = 0; c < bCols; c++) addBrick(c, r, r < 2 ? 'strong' : 'normal'); },
                    function() {
                        for (var r = 0; r < bRows; r++)
                            for (var c = 0; c < bCols; c++) {
                                if (r === 5) addBrick(c, r, 'gold');
                                else if (r < 2) addBrick(c, r, 'strong');
                                else addBrick(c, r, 'normal');
                            }
                    },
                    function() {
                        var rows = Math.min(bRows + 4, 5 + Math.floor((level - 4) / 2));
                        for (var r = 0; r < rows; r++)
                            for (var c = 0; c < bCols; c++) {
                                var rnd = Math.random();
                                if (rnd < 0.15 && CFG.goldFreq !== 'none') addBrick(c, r, 'gold');
                                else if (rnd < 0.35) addBrick(c, r, 'strong');
                                else addBrick(c, r, 'normal');
                            }
                    }
                ];
                var li = Math.min(level - 1, layouts.length - 1);
                if (level > layouts.length) layouts[layouts.length - 1]();
                else layouts[li]();
            }

            // Hard mode: steel bricks, denser, more rows
            else if (MODE === 'hard') {
                var layouts = [
                    function() { for (var r = 0; r < 6; r++) for (var c = 0; c < bCols; c++) addBrick(c, r, r === 2 && c%3===0 ? 'steel' : 'normal'); },
                    function() { for (var r = 0; r < bRows; r++) for (var c = 0; c < bCols; c++) addBrick(c, r, r < 2 ? 'strong' : (r === 3 && c%3===0 ? 'steel' : 'normal')); },
                    function() {
                        for (var r = 0; r < bRows; r++)
                            for (var c = 0; c < bCols; c++) {
                                if (r === 2 && (c === 2 || c === 5 || c === 8)) addBrick(c, r, 'steel');
                                else if (r === 4 && (c === 3 || c === 6)) addBrick(c, r, 'steel');
                                else if (r < 2) addBrick(c, r, 'strong');
                                else addBrick(c, r, 'normal');
                            }
                    },
                    function() {
                        var rows = Math.min(bRows + 3, 5 + Math.floor((level - 4) / 2));
                        for (var r = 0; r < rows; r++)
                            for (var c = 0; c < bCols; c++) {
                                var rnd = Math.random();
                                if (rnd < 0.12) addBrick(c, r, 'steel');
                                else if (rnd < 0.35) addBrick(c, r, 'strong');
                                else addBrick(c, r, 'normal');
                            }
                    }
                ];
                var li = Math.min(level - 1, layouts.length - 1);
                if (level > layouts.length) layouts[layouts.length - 1]();
                else layouts[li]();
            }

            // Precision: sparse layouts with gold in corners, smaller gaps
            else if (MODE === 'precision') {
                var layouts = [
                    function() {
                        for (var r = 0; r < bRows; r++)
                            for (var c = 0; c < bCols; c++) {
                                if (r === 0 && (c === 0 || c === bCols-1)) addBrick(c, r, 'gold');
                                else if ((c + r) % 3 !== 0) addBrick(c, r, 'normal');
                            }
                    },
                    function() {
                        for (var r = 0; r < bRows; r++)
                            for (var c = 0; c < bCols; c++) {
                                if (r === 0 && (c <= 1 || c >= bCols-2)) addBrick(c, r, 'gold');
                                else if ((r + c) % 2 === 0) addBrick(c, r, 'strong');
                                else if (c % 3 !== 0) addBrick(c, r, 'normal');
                            }
                    },
                    function() {
                        for (var r = 0; r < bRows; r++)
                            for (var c = 0; c < bCols; c++) {
                                if (r <= 1 && (c === 0 || c === bCols-1)) addBrick(c, r, 'gold');
                                else if (c === 3 || c === 6) addBrick(c, r, 'normal');
                                else if ((r + c) % 3 !== 1) addBrick(c, r, 'strong');
                            }
                    },
                    function() {
                        for (var r = 0; r < bRows; r++)
                            for (var c = 0; c < bCols; c++) {
                                var rnd = Math.random();
                                if (rnd < 0.08 && (c <= 1 || c >= bCols-2)) addBrick(c, r, 'gold');
                                else if (rnd < 0.45) { if ((r + c) % 3 !== 0) addBrick(c, r, rnd < 0.25 ? 'strong' : 'normal'); }
                            }
                    }
                ];
                var li = Math.min(level - 1, layouts.length - 1);
                if (level > layouts.length) layouts[layouts.length - 1]();
                else layouts[li]();
            }

            // Gold Rush: abundant gold bricks
            else if (MODE === 'gold') {
                var layouts = [
                    function() { for (var r = 0; r < 5; r++) for (var c = 0; c < bCols; c++) addBrick(c, r, r === 2 ? 'gold' : 'normal'); },
                    function() { for (var r = 0; r < bRows; r++) for (var c = 0; c < bCols; c++) addBrick(c, r, r === 0 || r === 4 ? 'gold' : (r < 2 ? 'strong' : 'normal')); },
                    function() {
                        for (var r = 0; r < bRows; r++)
                            for (var c = 0; c < bCols; c++) {
                                if (r === 1 || r === 4) addBrick(c, r, 'gold');
                                else if (r < 2) addBrick(c, r, 'strong');
                                else addBrick(c, r, 'normal');
                            }
                    },
                    function() {
                        var rows = Math.min(bRows + 4, 5 + Math.floor((level - 4) / 2));
                        for (var r = 0; r < rows; r++)
                            for (var c = 0; c < bCols; c++) {
                                var rnd = Math.random();
                                if (rnd < 0.25) addBrick(c, r, 'gold');
                                else if (rnd < 0.45) addBrick(c, r, 'strong');
                                else addBrick(c, r, 'normal');
                            }
                    }
                ];
                var li = Math.min(level - 1, layouts.length - 1);
                if (level > layouts.length) layouts[layouts.length - 1]();
                else layouts[li]();
            }

            // Power-Up mode: same as classic but with more power-up opportunities
            else if (MODE === 'powerup') {
                var layouts = [
                    function() { for (var r = 0; r < 5; r++) for (var c = 0; c < bCols; c++) addBrick(c, r, 'normal'); },
                    function() { for (var r = 0; r < bRows; r++) for (var c = 0; c < bCols; c++) addBrick(c, r, r < 2 ? 'strong' : 'normal'); },
                    function() {
                        for (var r = 0; r < bRows; r++)
                            for (var c = 0; c < bCols; c++) {
                                if (r === 5) addBrick(c, r, 'gold');
                                else if (r < 2) addBrick(c, r, 'strong');
                                else addBrick(c, r, 'normal');
                            }
                    },
                    function() {
                        var rows = Math.min(bRows + 4, 5 + Math.floor((level - 4) / 2));
                        for (var r = 0; r < rows; r++)
                            for (var c = 0; c < bCols; c++) {
                                var rnd = Math.random();
                                if (rnd < 0.15) addBrick(c, r, 'gold');
                                else if (rnd < 0.4) addBrick(c, r, 'strong');
                                else addBrick(c, r, 'normal');
                            }
                    }
                ];
                var li = Math.min(level - 1, layouts.length - 1);
                if (level > layouts.length) layouts[layouts.length - 1]();
                else layouts[li]();
            }

            // Retro: simple 5-row layouts, no steel, no gold
            else if (MODE === 'retro') {
                var layouts = [
                    function() { for (var r = 0; r < 5; r++) for (var c = 0; c < bCols; c++) addBrick(c, r, 'normal'); },
                    function() { for (var r = 0; r < 5; r++) for (var c = 0; c < bCols; c++) addBrick(c, r, r < 1 ? 'strong' : 'normal'); },
                    function() {
                        for (var r = 0; r < 5; r++)
                            for (var c = 0; c < bCols; c++) {
                                if (r < 2 && c % 2 === 0) addBrick(c, r, 'strong');
                                else addBrick(c, r, 'normal');
                            }
                    },
                    function() {
                        for (var r = 0; r < 5; r++)
                            for (var c = 0; c < bCols; c++) {
                                var rnd = Math.random();
                                if (rnd < 0.35) addBrick(c, r, 'strong');
                                else addBrick(c, r, 'normal');
                            }
                    }
                ];
                var li = Math.min(level - 1, layouts.length - 1);
                if (level > layouts.length) layouts[layouts.length - 1]();
                else layouts[li]();
            }

            // Fallback: classic layouts
            else {
                for (var r = 0; r < bRows; r++)
                    for (var c = 0; c < bCols; c++)
                        addBrick(c, r, 'normal');
            }

            var mult = 1 + (level - 1) * CFG.speedRamp;
            for (var i = 0; i < balls.length; i++) {
                var b = balls[i], spd = Math.sqrt(b.dx*b.dx + b.dy*b.dy);
                var ns = b.baseSpeed * mult;
                b.dx = (b.dx/spd) * ns; b.dy = (b.dy/spd) * ns;
            }
        }

        function addBrick(col, row, type) {
            var d = BRICK_DEFS[type];
            bricks.push({ x: col*80+10, y: row*30+45, w: 75, h: 25, type: type, hits: d.hits, maxHits: d.hits, color: d.color, glow: d.glow, points: d.points });
        }

        // ── UPDATE ───────────────────────────────────
        function update() {
            if (gameState !== 'playing') return;
            updatePaddle();
            updateBalls();
            updatePowerups();
            updateParticles();
            updateFloatTexts();
            checkCollisions();
            if (powerupTimer > 0 && --powerupTimer === 0 && paddle.w !== CFG.paddleW) paddle.w = CFG.paddleW;
            if (shakeTimer > 0) shakeTimer--;
            checkWin();
        }

        function updatePaddle() {
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= 7;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += 7;
            if (mouse.active) paddle.x += (mouse.x - paddle.w/2 - paddle.x) * 0.6;
            paddle.x = Math.max(0, Math.min(800 - paddle.w, paddle.x));
        }

        function updateBalls() {
            for (var i = balls.length-1; i >= 0; i--) {
                var b = balls[i];
                b.x += b.dx; b.y += b.dy;
                if (b.x - b.r <= 0) { b.dx = Math.abs(b.dx); b.x = b.r; spawnParticles(b.x, b.y, NEON.cyan, 4); }
                if (b.x + b.r >= 800) { b.dx = -Math.abs(b.dx); b.x = 800 - b.r; spawnParticles(b.x, b.y, NEON.cyan, 4); }
                if (b.y - b.r <= 0) { b.dy = Math.abs(b.dy); b.y = b.r; spawnParticles(b.x, b.y, NEON.cyan, 4); }
                if (b.y > 650) { balls.splice(i, 1); if (balls.length === 0) loseLife(); }
            }
        }

        function updatePowerups() {
            for (var i = powerups.length-1; i >= 0; i--) {
                powerups[i].y += 2.5;
                powerups[i].rot += 0.06;
                if (powerups[i].y > 620) powerups.splice(i, 1);
            }
        }

        function updateParticles() {
            for (var i = particles.length-1; i >= 0; i--) {
                var p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= 0.018;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function updateFloatTexts() {
            for (var i = floatTexts.length-1; i >= 0; i--) {
                floatTexts[i].y -= 1.5;
                floatTexts[i].life -= 0.025;
                if (floatTexts[i].life <= 0) floatTexts.splice(i, 1);
            }
        }

        function spawnParticles(x, y, color, count) {
            for (var i = 0; i < Math.floor(count * CFG.particleMult); i++) {
                particles.push({ x:x, y:y, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8-2, life:1, color:color });
            }
        }

        function spawnFloat(x, y, text, color) {
            floatTexts.push({ x:x, y:y, text:text, color:color || NEON.gold, life:1 });
        }

        // ── COLLISION ────────────────────────────────
        function checkCollisions() {
            for (var bi = 0; bi < balls.length; bi++) {
                var b = balls[bi];
                // Paddle
                if (b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h &&
                    b.x >= paddle.x - 4 && b.x <= paddle.x + paddle.w + 4) {
                    var hitPos = (b.x - paddle.x) / paddle.w;
                    var angle = (hitPos - 0.5) * Math.PI * 0.7;
                    var spd = Math.sqrt(b.dx*b.dx + b.dy*b.dy);
                    b.dx = spd * Math.sin(angle);
                    b.dy = -spd * Math.cos(angle);
                    b.y = paddle.y - b.r;
                    if (b.dy > -2.5) b.dy = -2.5;
                    spawnParticles(b.x, b.y, NEON.cyan, 4);
                    sfxPaddle();
                }
                // Bricks
                for (var ri = bricks.length-1; ri >= 0; ri--) {
                    var r = bricks[ri];
                    if (b.x + b.r > r.x && b.x - b.r < r.x + r.w &&
                        b.y + b.r > r.y && b.y - b.r < r.y + r.h) {
                        var ox = Math.min(b.x+b.r - r.x, r.x+r.w - (b.x-b.r));
                        var oy = Math.min(b.y+b.r - r.y, r.y+r.h - (b.y-b.r));
                        if (ox < oy) b.dx = -b.dx; else b.dy = -b.dy;
                        hitBrick(ri);
                        break;
                    }
                }
            }
            // Powerups
            for (var pi = powerups.length-1; pi >= 0; pi--) {
                var pw = powerups[pi];
                if (pw.x+14 > paddle.x && pw.x-14 < paddle.x+paddle.w &&
                    pw.y+14 > paddle.y && pw.y-14 < paddle.y+paddle.h) {
                    activatePowerup(pw.type);
                    spawnParticles(pw.x, pw.y, pw.color, 12);
                    powerups.splice(pi, 1);
                    sfxPowerup();
                }
            }
        }

        function hitBrick(i) {
            var r = bricks[i];
            if (r.type === 'steel') { spawnParticles(r.x+r.w/2, r.y+r.h/2, '#555', 5); return; }
            r.hits--;
            score += r.points;
            if (r.hits > 0) {
                r.color = r.color.replace('ff','aa').replace('d7','a8').replace('b4','88');
            } else {
                spawnParticles(r.x+r.w/2, r.y+r.h/2, r.color, 18);
                spawnFloat(r.x+r.w/2, r.y, '+' + r.points, r.color);
                if (Math.random() < CFG.powerUpRate) {
                    var types = ['bigPaddle','multiBall','extraLife'];
                    var pwColors = {'bigPaddle': NEON.green, 'multiBall': NEON.cyan, 'extraLife': NEON.pink};
                    var t = types[Math.floor(Math.random()*3)];
                    powerups.push({ x:r.x+r.w/2, y:r.y+r.h/2, type:t, color:pwColors[t], rot:0 });
                }
                bricks.splice(i, 1);
            }
            sfxBrick({10:10,20:20,50:50}[r.points] || 10);
            updateHUD();
        }

        function activatePowerup(t) {
            switch(t) {
                case 'bigPaddle': paddle.w = CFG.paddleW * 1.6; powerupTimer = CFG.powerUpDuration; break;
                case 'multiBall':
                    var mb = balls[0]; if (!mb) break;
                    for (var i = 0; i < 2; i++) {
                        var a = Math.random()*Math.PI*0.5 + Math.PI*0.25;
                        var s = Math.sqrt(mb.dx*mb.dx+mb.dy*mb.dy);
                        balls.push({ x:mb.x, y:mb.y, r:7, dx:s*Math.cos(a)*(Math.random()>0.5?1:-1), dy:-s*Math.sin(a), baseSpeed:mb.baseSpeed });
                    }
                    break;
                case 'extraLife': lives++; sfxLife(); updateHearts(); updateHUD(); break;
            }
        }

        function loseLife() {
            lives--;
            updateHearts();
            updateHUD();
            shakeTimer = 18;
            gameArea.classList.add('shake');
            setTimeout(function(){ gameArea.classList.remove('shake'); }, 420);
            sfxLife();
            if (lives > 0) resetAfterLife();
            else { sfxGameOver(); gameOver(); }
        }

        function checkWin() {
            var left = bricks.filter(function(r){ return r.type !== 'steel'; });
            if (left.length === 0) {
                if (CFG.levelBonus > 0) { score += CFG.levelBonus * level; spawnFloat(400, 300, '+' + (CFG.levelBonus * level), NEON.gold); }
                level++; sfxLevelUp(); updateHUD(); createLevel(); resetAfterLife();
            }
        }

        function gameOver() {
            gameState = 'over';
            var isNew = score > highScore;
            if (isNew) { highScore = score; localStorage.setItem('bbHigh_' + MODE, highScore); }
            goFinalScore.textContent = score;
            goHighScore.textContent = 'HI-SCORE: ' + highScore;
            if (isNew) goNewHigh.classList.remove('hidden'); else goNewHigh.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
        }

        // ── RENDER ───────────────────────────────────
        function render() {
            ctx.clearRect(0, 0, 800, 600);

            // Background
            ctx.fillStyle = PAL.bg;
            ctx.fillRect(0, 0, 800, 600);

            // Cosmic: draw nebulae
            if (MODE === 'cosmic') {
                for (var ui = 0; ui < nebulae.length; ui++) {
                    var neb = nebulae[ui];
                    var grd = ctx.createRadialGradient(neb.x, neb.y, 0, neb.x, neb.y, neb.r);
                    grd.addColorStop(0, 'hsla(' + neb.hue + ', 60%, 30%, ' + (neb.a * 2) + ')');
                    grd.addColorStop(1, 'transparent');
                    ctx.fillStyle = grd;
                    ctx.beginPath();
                    ctx.arc(neb.x, neb.y, neb.r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Starfield
            for (var si = 0; si < bgStars.length; si++) {
                var s = bgStars[si];
                var alpha = s.a;
                // Cosmic: twinkling stars
                if (MODE === 'cosmic' && s.twinkle) {
                    alpha = s.a * (0.5 + 0.5 * Math.sin(Date.now() * 0.003 + si));
                }
                ctx.fillStyle = 'rgba(' + PAL.starColor + ',' + alpha + ')';
                ctx.fillRect(s.x, s.y, s.r, s.r);
            }

            // Retro mode: no glow on bricks
            var glowBlur = MODE === 'retro' ? 0 : 8;

            // Bricks with glow
            for (var i = 0; i < bricks.length; i++) {
                var r = bricks[i];
                ctx.shadowColor = r.glow;
                ctx.shadowBlur = glowBlur;
                ctx.fillStyle = r.color;
                ctx.fillRect(r.x, r.y, r.w, r.h);
                ctx.shadowBlur = 0;
                // Border
                ctx.strokeStyle = MODE === 'retro' ? 'rgba(0,0,0,0.6)' : 'rgba(0,0,0,0.4)';
                ctx.lineWidth = 1;
                ctx.strokeRect(r.x, r.y, r.w, r.h);
                // Shine highlight (retro skips)
                if (MODE !== 'retro') {
                    ctx.fillStyle = 'rgba(255,255,255,0.12)';
                    ctx.fillRect(r.x+1, r.y+1, r.w-2, 4);
                }
            }

            // Paddle with glow
            ctx.shadowColor = PAL.paddleGlow;
            ctx.shadowBlur = MODE === 'retro' ? 0 : 10;
            var pg = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
            pg.addColorStop(0, PAL.paddleGradTop);
            pg.addColorStop(1, PAL.paddleGradBot);
            ctx.fillStyle = pg;
            rrect(paddle.x, paddle.y, paddle.w, paddle.h, MODE === 'retro' ? 2 : 5);
            ctx.shadowBlur = 0;
            // Paddle powerup indicator
            if (powerupTimer > 0 && CFG.showPowerups) {
                ctx.strokeStyle = NEON.green;
                ctx.lineWidth = 2;
                ctx.shadowColor = 'rgba(0,208,132,0.6)';
                ctx.shadowBlur = MODE === 'retro' ? 0 : 12;
                rrect(paddle.x-3, paddle.y-3, paddle.w+6, paddle.h+6, 6, true);
                ctx.shadowBlur = 0;
            }

            // Balls with glow
            for (var j = 0; j < balls.length; j++) {
                var b = balls[j];
                ctx.shadowColor = PAL.ballGlow;
                ctx.shadowBlur = MODE === 'retro' ? 0 : 15;
                var bg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
                bg.addColorStop(0, PAL.ballInner);
                bg.addColorStop(0.4, PAL.ballMid);
                bg.addColorStop(1, PAL.ballOuter);
                ctx.fillStyle = bg;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
                // Cosmic: dust trail behind ball
                if (MODE === 'cosmic') {
                    ctx.fillStyle = 'rgba(' + PAL.starColor + ',0.25)';
                    ctx.beginPath();
                    ctx.arc(b.x - b.dx * 1.5, b.y - b.dy * 1.5, b.r * 0.6, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            // Powerups
            if (CFG.showPowerups) {
                for (var k = 0; k < powerups.length; k++) {
                    var pw = powerups[k];
                    ctx.save();
                    ctx.translate(pw.x, pw.y);
                    ctx.rotate(pw.rot);
                    ctx.shadowColor = pw.color;
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = pw.color;
                    rrect(-14, -14, 28, 28, 4);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 12px Orbitron, monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    var label = pw.type === 'bigPaddle' ? 'W' : pw.type === 'multiBall' ? 'M' : '+';
                    ctx.fillText(label, 0, 0);
                    ctx.restore();
                }
            }

            // Particles
            for (var m = 0; m < particles.length; m++) {
                var p = particles[m];
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = MODE === 'retro' ? 0 : 4;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2.2, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;

            // Float text
            for (var n = 0; n < floatTexts.length; n++) {
                var ft = floatTexts[n];
                ctx.globalAlpha = ft.life;
                ctx.fillStyle = ft.color;
                ctx.shadowColor = ft.color;
                ctx.shadowBlur = MODE === 'retro' ? 0 : 6;
                ctx.font = 'bold 13px ' + (MODE === 'retro' ? '"Press Start 2P", monospace' : '"Press Start 2P", monospace');
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
            }
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
        }

        function rrect(x, y, w, h, r, strokeOnly) {
            ctx.beginPath();
            ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
            ctx.quadraticCurveTo(x+w, y, x+w, y+r);
            ctx.lineTo(x+w, y+h-r);
            ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
            ctx.lineTo(x+r, y+h);
            ctx.quadraticCurveTo(x, y+h, x, y+h-r);
            ctx.lineTo(x, y+r);
            ctx.quadraticCurveTo(x, y, x+r, y);
            ctx.closePath();
            if (strokeOnly) ctx.stroke(); else ctx.fill();
        }

        // ── HUD ──────────────────────────────────────
        function updateHUD() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('highScore').textContent = highScore;
        }

        function updateHearts() {
            var h = '';
            for (var i = 0; i < lives; i++) h += '♥ ';
            document.getElementById('hearts').textContent = h || '—';
        }

        // ── EVENTS ───────────────────────────────────
        document.addEventListener('keydown', function(e) { keys[e.key] = true; });
        document.addEventListener('keyup', function(e) { keys[e.key] = false; });

        canvas.addEventListener('mousemove', function(e) {
            var rect = canvas.getBoundingClientRect();
            mouse.x = (e.clientX - rect.left) * (800 / rect.width);
            mouse.active = true;
        });
        canvas.addEventListener('mouseleave', function() { mouse.active = false; });

        canvas.addEventListener('touchmove', function(e) {
            e.preventDefault();
            var rect = canvas.getBoundingClientRect();
            mouse.x = (e.touches[0].clientX - rect.left) * (800 / rect.width);
            mouse.active = true;
        }, { passive: false });
        canvas.addEventListener('touchend', function() { mouse.active = false; });

        // Start game on click or space
        function handleStart() {
            if (gameState === 'waiting' || gameState === 'over') startGame();
        }
        canvas.addEventListener('click', handleStart);
        startScreen.addEventListener('click', handleStart);
        document.addEventListener('keydown', function(e) {
            if (e.key === ' ' && (gameState === 'waiting' || gameState === 'over')) { e.preventDefault(); startGame(); }
        });

        document.getElementById('goRestartBtn').addEventListener('click', startGame);

        document.getElementById('btnFull').addEventListener('click', function() {
            initAudio();
            var el = document.documentElement;
            (document.fullscreenElement ? document.exitFullscreen :
             el.requestFullscreen ? el.requestFullscreen() :
             el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);
        });

        document.getElementById('btnRestart').addEventListener('click', function() { initAudio(); startGame(); });
        document.getElementById('btnSound').addEventListener('click', function() {
            initAudio();
            soundOn = !soundOn;
            document.getElementById('btnSound').textContent = soundOn ? '[S]ND' : '[M]UTE';
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT') return;
            switch(e.key.toLowerCase()) {
                case 'f': if (!e.ctrlKey) document.getElementById('btnFull').click(); break;
                case 'r': if (!e.ctrlKey) { e.preventDefault(); startGame(); } break;
                case 's': if (!e.ctrlKey) { e.preventDefault(); document.getElementById('btnSound').click(); } break;
            }
        });

        // Listen for parent page messages
        window.addEventListener('message', function(e) {
            if (e.data === 'restart') startGame();
            if (e.data === 'fullscreen') document.getElementById('btnFull').click();
        });

        // ── LOOP ─────────────────────────────────────
        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        // ── INIT ─────────────────────────────────────
        initState();

        // Retro mode: hide level and high score from HUD
        if (!CFG.showLevel) {
            document.getElementById('level').parentElement.style.display = 'none';
        }
        if (!CFG.showHighScore) {
            document.getElementById('highScore').parentElement.style.display = 'none';
        }

        // Update start screen subtitle per mode
        var modeNames = {
            classic: '◆ CLASSIC ARCADE EDITION ◆',
            powerup: '◆ POWER-UP ARENA ◆',
            neon: '◆ NEON STYLE ◆',
            hard: '◆ EXPERT CHALLENGE ◆',
            precision: '◆ PRECISION HIT ◆',
            gold: '◆ GOLD RUSH ◆',
            cosmic: '◆ COSMIC RUN ◆',
            retro: '◆ RETRO ARCADE ◆'
        };
        var subtitleEl = document.querySelector('.start-subtitle');
        if (subtitleEl) subtitleEl.textContent = modeNames[MODE] || modeNames.classic;

        updateHUD();
        updateHearts();
        loop();

        // Hide loading, show start screen
        startScreen.classList.remove('hidden');
        gameOverScreen.classList.add('hidden');
    })();
    </script>
</body>
</html>
