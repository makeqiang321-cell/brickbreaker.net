<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Gun Mayhem 3</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0b0f; overflow: hidden; }
  #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  ruffle-player { width: 100%; height: 100%; }
  .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fca5a5; font: 600 15px/1.4 Inter, system-ui, sans-serif; letter-spacing: .4px; pointer-events: none; }
</style>
</head>
<body>
<div id="game"><div class="loading">Loading Gun Mayhem 3…</div></div>
<script src="https://unpkg.com/@ruffle-rs/ruffle@0.7.1/ruffle.js"></script>
<script>
(function () {
  var wrap = document.getElementById('game');
  var ruffle = window.RufflePlayer && window.RufflePlayer.newest();
  if (!ruffle) return;
  var player = ruffle.createPlayer();
  player.id = 'ruffle';
  player.style.width = '100%';
  player.style.height = '100%';
  wrap.innerHTML = '';
  wrap.appendChild(player);
  player.load('gunmayhemredux.swf').catch(function () {});
})();
</script>
</body>
</html>
