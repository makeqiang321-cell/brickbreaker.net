  <!-- Purple accent underline -->
  <rect x="350" y="385" width="500" height="5" rx="3" fill="url(#accentGrad)"/>

  <!-- Subtitle -->
  <text x="600" y="435" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="700" fill="#7c3aed" text-anchor="middle" letter-spacing="6">◆ PLAY ONLINE FREE ◆</text>

  <!-- Tagline -->
  <text x="600" y="480" font-family="Inter,system-ui,sans-serif" font-size="18" fill="#6c757d" text-anchor="middle" letter-spacing="3">NO DOWNLOAD  ·  INSTANT PLAY  ·  ALL DEVICES</text>

  <!-- URL -->
  <text x="600" y="585" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="600" fill="#7c3aed" fill-opacity="0.5" text-anchor="middle" letter-spacing="4">brickbreaker.net</text>
</svg>
