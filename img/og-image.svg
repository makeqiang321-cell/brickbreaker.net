<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8f9fa"/><stop offset="100%" stop-color="#ede9fe"/></linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="none" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.15" rx="8"/>

  <!-- Decorative dots -->
  <circle cx="80" cy="80" r="4" fill="#7c3aed" opacity="0.12"/>
  <circle cx="200" cy="50" r="3" fill="#0693e3" opacity="0.1"/>
  <circle cx="350" cy="90" r="5" fill="#7c3aed" opacity="0.08"/>
  <circle cx="850" cy="60" r="4" fill="#0693e3" opacity="0.1"/>
  <circle cx="1000" cy="100" r="3" fill="#7c3aed" opacity="0.12"/>
  <circle cx="1100" cy="50" r="5" fill="#fcb900" opacity="0.1"/>

  <!-- Brick row -->
  <rect x="150" y="100" width="150" height="40" rx="6" fill="#7c3aed" opacity="0.9"/>
  <rect x="320" y="100" width="150" height="40" rx="6" fill="#0693e3" opacity="0.9"/>
  <rect x="490" y="100" width="150" height="40" rx="6" fill="#fcb900" opacity="0.9"/>
  <rect x="660" y="100" width="150" height="40" rx="6" fill="#a78bfa" opacity="0.9"/>
  <rect x="830" y="100" width="150" height="40" rx="6" fill="#00d084" opacity="0.9"/>

  <!-- Brick shine highlights -->
  <rect x="152" y="102" width="146" height="6" rx="3" fill="#fff" opacity="0.25"/>
  <rect x="322" y="102" width="146" height="6" rx="3" fill="#fff" opacity="0.25"/>
  <rect x="492" y="102" width="146" height="6" rx="3" fill="#fff" opacity="0.3"/>
  <rect x="662" y="102" width="146" height="6" rx="3" fill="#fff" opacity="0.25"/>
  <rect x="832" y="102" width="146" height="6" rx="3" fill="#fff" opacity="0.25"/>

  <!-- Main Title -->
  <text x="600" y="280" font-family="Inter,system-ui,sans-serif" font-size="76" font-weight="800" fill="#212529" text-anchor="middle" letter-spacing="4">
    BRICK
  </text>
  <text x="600" y="360" font-family="Inter,system-ui,sans-serif" font-size="76" font-weight="800" fill="#212529" text-anchor="middle" letter-spacing="4">
    BREAKER
