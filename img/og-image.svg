<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="glowPink"><feGaussianBlur stdDeviation="6"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowCyan"><feGaussianBlur stdDeviation="6"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowGold"><feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowGreen"><feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f0f23"/><stop offset="100%" stop-color="#1a1040"/></linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="none" stroke="rgba(0,212,255,0.2)" stroke-width="3" rx="8"/>

  <!-- Stars -->
  <circle cx="50" cy="40" r="1.5" fill="#aabbcc" opacity="0.6"/>
  <circle cx="150" cy="90" r="2" fill="#8899bb" opacity="0.5"/>
  <circle cx="300" cy="30" r="1.5" fill="#aabbcc" opacity="0.7"/>
  <circle cx="450" cy="70" r="1" fill="#8899bb" opacity="0.4"/>
  <circle cx="600" cy="25" r="2" fill="#aabbcc" opacity="0.6"/>
  <circle cx="750" cy="55" r="1.5" fill="#8899bb" opacity="0.5"/>
  <circle cx="900" cy="35" r="1" fill="#aabbcc" opacity="0.7"/>
  <circle cx="1050" cy="80" r="2" fill="#8899bb" opacity="0.4"/>
  <circle cx="1150" cy="45" r="1.5" fill="#aabbcc" opacity="0.6"/>
  <circle cx="80" cy="180" r="1" fill="#8899bb" opacity="0.3"/>
  <circle cx="1120" cy="200" r="1" fill="#aabbcc" opacity="0.3"/>

  <!-- Brick row -->
  <rect x="150" y="100" width="150" height="40" rx="4" fill="#ff2d78" opacity="0.85" filter="url(#glowPink)"/>
  <rect x="320" y="100" width="150" height="40" rx="4" fill="#00d4ff" opacity="0.85" filter="url(#glowCyan)"/>
  <rect x="490" y="100" width="150" height="40" rx="4" fill="#ffd700" opacity="0.9" filter="url(#glowGold)"/>
  <rect x="660" y="100" width="150" height="40" rx="4" fill="#b44dff" opacity="0.85" filter="url(#glowCyan)"/>
  <rect x="830" y="100" width="150" height="40" rx="4" fill="#39ff14" opacity="0.85" filter="url(#glowGreen)"/>

  <!-- Main Title -->
  <text x="600" y="280" font-family="monospace" font-size="72" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="8">
    BRICK
  </text>
  <text x="600" y="360" font-family="monospace" font-size="72" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="8">
    BREAKER
  </text>

  <!-- Neon title glow effect -->
  <text x="600" y="280" font-family="monospace" font-size="72" font-weight="bold" fill="none" stroke="#00d4ff" stroke-width="1.5" text-anchor="middle" letter-spacing="8" opacity="0.6" filter="url(#glowCyan)"/>
  <text x="600" y="360" font-family="monospace" font-size="72" font-weight="bold" fill="none" stroke="#ff2d78" stroke-width="1.5" text-anchor="middle" letter-spacing="8" opacity="0.6" filter="url(#glowPink)"/>

  <!-- Subtitle -->
  <text x="600" y="410" font-family="monospace" font-size="26" font-weight="700" fill="#ffd700" text-anchor="middle" letter-spacing="10" filter="url(#glowGold)">◆ RETRO ARCADE ◆</text>

  <!-- Tagline -->
  <text x="600" y="460" font-family="monospace" font-size="20" fill="#7888a8" text-anchor="middle" letter-spacing="6">PLAY ONLINE FREE  ·  NO DOWNLOAD</text>

  <!-- URL -->
  <text x="600" y="580" font-family="monospace" font-size="18" fill="rgba(0,212,255,0.4)" text-anchor="middle" letter-spacing="5">brickbreaker.net</text>

  <!-- Scanlines -->
  <pattern id="scanlines" width="1200" height="4" patternUnits="userSpaceOnUse">
    <rect x="0" y="0" width="1200" height="2" fill="rgba(0,0,0,0.04)"/>
    <rect x="0" y="2" width="1200" height="2" fill="transparent"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#scanlines)" pointer-events="none"/>
</svg>
