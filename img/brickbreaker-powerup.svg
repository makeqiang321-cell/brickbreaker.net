<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="bg"><feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bg2"><feGaussianBlur stdDeviation="6"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bg3"><feGaussianBlur stdDeviation="10"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="pg"><feGaussianBlur stdDeviation="7"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="pu"><feGaussianBlur stdDeviation="6"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gr"><feGaussianBlur stdDeviation="8"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="bg" cx="0.35" cy="0.35"><stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#fcb900"/><stop offset="100%" stop-color="#805000"/></radialGradient>
    <linearGradient id="pgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00d084"/><stop offset="100%" stop-color="#0a4a30"/></linearGradient>
  </defs>

  <!-- Black bg -->
  <rect width="800" height="600" fill="#000000"/>

  <!-- Starfield -->
  <g fill="#c8dcff">
    <circle cx="55" cy="30" r="1" opacity="0.35"/><circle cx="150" cy="70" r="0.8" opacity="0.3"/>
    <circle cx="270" cy="20" r="1.1" opacity="0.4"/><circle cx="390" cy="48" r="0.7" opacity="0.25"/>
    <circle cx="510" cy="22" r="0.9" opacity="0.3"/><circle cx="650" cy="60" r="1.1" opacity="0.35"/>
    <circle cx="730" cy="15" r="0.6" opacity="0.4"/><circle cx="780" cy="55" r="1" opacity="0.25"/>
    <circle cx="30" cy="110" r="0.7" opacity="0.2"/><circle cx="760" cy="100" r="0.8" opacity="0.2"/>
  </g>

  <!-- Scattered remaining bricks (high level, most cleared) -->
  <g filter="url(#bg)">
    <rect x="240" y="80" width="75" height="25" rx="2" fill="#7c3aed"/>
    <rect x="500" y="80" width="75" height="25" rx="2" fill="#fcb900" opacity="0.9"/>
    <rect x="120" y="108" width="75" height="25" rx="2" fill="#a78bfa"/>
  </g>
  <g stroke="rgba(0,0,0,0.4)" stroke-width="0.8">
    <rect x="240" y="80" width="75" height="25" rx="2" fill="none"/>
    <rect x="500" y="80" width="75" height="25" rx="2" fill="none"/>
    <rect x="120" y="108" width="75" height="25" rx="2" fill="none"/>
  </g>

  <!-- Steel obstacles -->
  <g filter="url(#bg)">
    <rect x="340" y="108" width="75" height="25" rx="2" fill="#333333"/>
    <rect x="620" y="80" width="75" height="25" rx="2" fill="#333333"/>
  </g>

  <!-- Particle burst from destroyed brick -->
  <g fill="#fcb900">
    <rect x="410" y="88" width="6" height="6" rx="1" opacity="0.7"/>
    <rect x="425" y="80" width="4" height="4" rx="1" opacity="0.5"/>
    <rect x="418" y="98" width="3" height="3" rx="1" opacity="0.4"/>
    <rect x="405" y="84" width="5" height="5" rx="1" opacity="0.6"/>
    <rect x="432" y="90" width="4" height="4" rx="1" opacity="0.5"/>
  </g>

  <!-- 3 Multi-balls in play -->
  <g filter="url(#bg3)">
    <circle cx="250" cy="400" r="7" fill="url(#bg)"/>
    <circle cx="440" cy="440" r="7" fill="url(#bg)"/>
    <circle cx="560" cy="370" r="7" fill="url(#bg)"/>
  </g>

  <!-- Ball trails -->
  <circle cx="265" cy="387" r="3.5" fill="#fcb900" opacity="0.35"/>
  <circle cx="275" cy="378" r="2.5" fill="#fcb900" opacity="0.2"/>
  <circle cx="455" cy="428" r="3.5" fill="#fcb900" opacity="0.35"/>
  <circle cx="465" cy="420" r="2.5" fill="#fcb900" opacity="0.2"/>
  <circle cx="548" cy="382" r="3.5" fill="#fcb900" opacity="0.35"/>
  <circle cx="540" cy="390" r="2.5" fill="#fcb900" opacity="0.2"/>

  <!-- Falling Extra Life power-up -->
  <g filter="url(#pu)">
    <rect x="440" y="310" width="28" height="28" rx="4" fill="#0693e3"/>
  </g>
  <text x="454" y="331" font-family="Orbitron,monospace" font-size="22" font-weight="700" fill="#000" text-anchor="middle">+</text>

  <!-- Big Paddle (wide, green gradient, with green border glow) -->
  <rect x="190" y="545" width="420" height="14" rx="5" fill="url(#pgG)" filter="url(#pg)"/>
  <!-- Green powerup border glow -->
  <rect x="187" y="542" width="426" height="20" rx="6" fill="none" stroke="#00d084" stroke-width="2" filter="url(#gr)" opacity="0.8"/>

  <!-- HUD -->
  <g font-family="Orbitron,monospace" font-weight="700" letter-spacing="1">
    <text x="15" y="22" font-size="15" fill="#fcb900">SCORE</text>
    <text x="90" y="22" font-size="16" font-weight="900" fill="#fcb900">5,820</text>
    <text x="340" y="22" font-size="15" fill="#0693e3">♥ ♥</text>
    <text x="530" y="22" font-size="15" fill="#7c3aed">LEVEL</text>
    <text x="602" y="22" font-size="16" font-weight="900" fill="#7c3aed">8</text>
    <text x="650" y="22" font-size="12" font-weight="700" fill="#00d084">BIG PADDLE!</text>
  </g>
</svg>
