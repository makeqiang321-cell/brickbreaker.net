<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80" fill="none">
  <!-- ═══════════════ Icon Mark: Brick Wall + Breaking Ball ═══════════════ -->
  <!-- Top row bricks (intact) -->
  <rect x="4" y="8" width="18" height="9" rx="1.5" fill="#fcb900"/>
  <rect x="24" y="8" width="18" height="9" rx="1.5" fill="#7c3aed"/>
  <rect x="44" y="8" width="18" height="9" rx="1.5" fill="#fcb900"/>

  <!-- Middle row bricks (being broken — cracked/destroyed) -->
  <rect x="4" y="19" width="18" height="9" rx="1.5" fill="#7c3aed"/>
  <!-- Center brick EXPLODED — fragments flying -->
  <rect x="26" y="16" width="6" height="5" rx="1" fill="#7c3aed" transform="rotate(-25 29 18)" opacity="0.7"/>
  <rect x="34" y="12" width="5" height="4" rx="1" fill="#7c3aed" transform="rotate(40 36 14)" opacity="0.5"/>
  <rect x="32" y="18" width="4" height="3" rx="0.8" fill="#fcb900" transform="rotate(15 34 19)" opacity="0.6"/>
  <rect x="38" y="21" width="5" height="4" rx="1" fill="#7c3aed" transform="rotate(-50 40 23)" opacity="0.5"/>
  <rect x="44" y="19" width="18" height="9" rx="1.5" fill="#fcb900"/>

  <!-- Bottom row bricks -->
  <rect x="4" y="30" width="18" height="9" rx="1.5" fill="#fcb900"/>
  <rect x="24" y="30" width="18" height="9" rx="1.5" fill="#7c3aed"/>
  <rect x="44" y="30" width="18" height="9" rx="1.5" fill="#fcb900"/>

  <!-- Ball (mid-flight, smashing into center) -->
  <circle cx="37" cy="36" r="6" fill="#fcb900"/>
  <circle cx="35" cy="34" r="2" fill="#fff" opacity="0.5"/>

  <!-- Ball motion trail -->
  <circle cx="56" cy="43" r="3.5" fill="#fcb900" opacity="0.35"/>
  <circle cx="48" cy="40" r="4.5" fill="#fcb900" opacity="0.55"/>

  <!-- Impact burst lines -->
  <line x1="23" y1="20" x2="20" y2="15" stroke="#fcb900" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="31" y1="14" x2="30" y2="8" stroke="#fcb900" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="42" y1="16" x2="46" y2="12" stroke="#fcb900" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- ═══════════════ Wordmark ═══════════════ -->
  <text x="76" y="46" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="28" font-weight="800" fill="#212529" letter-spacing="-0.5">BRICK</text>
  <text x="176" y="46" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="28" font-weight="800" fill="#7c3aed" letter-spacing="-0.5">BREAKER</text>

  <!-- Gold accent line -->
  <rect x="76" y="54" width="210" height="2.5" rx="1.25" fill="#fcb900" opacity="0.7"/>

  <!-- Tagline -->
  <text x="77" y="70" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="9" font-weight="600" fill="#6c757d" letter-spacing="2.5">◆ PLAY FREE ONLINE ◆</text>
</svg>
