<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80" fill="none">
  <!-- ═══════════ Icon: Game screen badge ═══════════ -->
  <!-- Badge background -->
  <rect x="2" y="10" width="62" height="62" rx="12" fill="#1a1a2e" stroke="#7c3aed" stroke-width="2"/>

  <!-- Bricks (3 rows, top area) -->
  <!-- Row 1 -->
  <rect x="10" y="18" width="14" height="8" rx="1.5" fill="#7c3aed"/>
  <rect x="26" y="18" width="14" height="8" rx="1.5" fill="#fcb900"/>
  <rect x="42" y="18" width="14" height="8" rx="1.5" fill="#7c3aed"/>

  <!-- Row 2 — center brick cracked open -->
  <rect x="10" y="28" width="14" height="8" rx="1.5" fill="#fcb900"/>
  <!-- Crack visible on center brick -->
  <rect x="26" y="28" width="14" height="8" rx="1.5" fill="#7c3aed"/>
  <line x1="30" y1="28" x2="36" y2="36" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="28" x2="33" y2="36" stroke="#1a1a2e" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="42" y="28" width="14" height="8" rx="1.5" fill="#fcb900"/>

  <!-- Row 3 -->
  <rect x="10" y="38" width="14" height="8" rx="1.5" fill="#7c3aed"/>
  <rect x="26" y="38" width="14" height="8" rx="1.5" fill="#fcb900"/>
  <rect x="42" y="38" width="14" height="8" rx="1.5" fill="#7c3aed"/>

  <!-- Paddle at bottom -->
  <rect x="16" y="56" width="34" height="6" rx="3" fill="#a78bfa"/>

  <!-- Ball in mid-flight (between paddle and bricks) -->
  <circle cx="42" cy="48" r="4.5" fill="#fcb900"/>
  <circle cx="41" cy="46.5" r="1.5" fill="#fff" opacity="0.45"/>

  <!-- Ball trail arc (dotted) -->
  <circle cx="30" cy="56" r="1.8" fill="#fcb900" opacity="0.4"/>
  <circle cx="34" cy="53" r="2.2" fill="#fcb900" opacity="0.5"/>
  <circle cx="38" cy="50" r="2.8" fill="#fcb900" opacity="0.6"/>

  <!-- ═══════════ Wordmark ═══════════ -->
  <text x="78" y="47" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="28" font-weight="800" fill="#212529" letter-spacing="-0.5">BRICK</text>
  <text x="178" y="47" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="28" font-weight="800" fill="#7c3aed" letter-spacing="-0.5">BREAKER</text>

  <!-- Gold accent line -->
  <rect x="78" y="55" width="210" height="2.5" rx="1.25" fill="#fcb900" opacity="0.7"/>

  <!-- Tagline -->
  <text x="80" y="71" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="9" font-weight="600" fill="#6c757d" letter-spacing="2.5">◆ PLAY FREE ONLINE ◆</text>
</svg>
