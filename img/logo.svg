<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <defs>
    <!-- Match real game's brick glow (shadowBlur: 8, shadowColor: rgba(124,58,237,0.6)) -->
    <filter id="brickGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Match real game's ball glow (shadowBlur: 15, gold) -->
    <filter id="ballGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Match real game ball radial gradient (white → #fcb900 → #805000) -->
    <radialGradient id="ballGrad" cx="0.38" cy="0.38">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fcb900"/>
      <stop offset="100%" stop-color="#805000"/>
    </radialGradient>
  </defs>

  <!-- ═══════ Icon: Real game brick being shattered by ball ═══════ -->
  <!-- Glowing purple brick (matching game's normal brick: #7c3aed, glow rgba(124,58,237,0.6)) -->
  <g filter="url(#brickGlow)">
    <rect x="6" y="22" width="42" height="34" rx="3" fill="#7c3aed"/>
  </g>
  <!-- Brick dark border (matching game: strokeStyle rgba(0,0,0,0.4)) -->
  <rect x="6" y="22" width="42" height="34" rx="3" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>
  <!-- Brick shine/highlight strip (matching game: rgba(255,255,255,0.12), 4px tall, 1px from top) -->
  <rect x="7" y="23" width="40" height="5" rx="2" fill="rgba(255,255,255,0.15)"/>

  <!-- Crack/break line on brick -->
  <line x1="16" y1="56" x2="36" y2="22" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <line x1="36" y1="22" x2="44" y2="30" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Gold ball with radial gradient + glow (matching game rendering) -->
  <g filter="url(#ballGlow)">
    <circle cx="46" cy="14" r="8" fill="url(#ballGrad)"/>
  </g>

  <!-- Small flying brick fragment (part of game visual) -->
  <rect x="0" y="14" width="8" height="6" rx="1.5" fill="#a78bfa" opacity="0.7"/>
  <rect x="48" y="52" width="6" height="5" rx="1" fill="#a78bfa" opacity="0.6"/>

  <!-- ═══════ Wordmark ═══════ -->
  <text x="66" y="47" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="800" fill="#212529" letter-spacing="-1">BRICK</text>
  <text x="178" y="47" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="800" fill="#7c3aed" letter-spacing="-1">BREAKER</text>

  <!-- Gold accent line -->
  <rect x="66" y="55" width="200" height="2.5" rx="1.25" fill="#fcb900" opacity="0.7"/>

  <!-- Tagline -->
  <text x="68" y="71" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="600" fill="#6c757d" letter-spacing="3">◆ PLAY FREE ONLINE ◆</text>
</svg>
