<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <!-- Icon: simple brick + ball -->
  <rect x="4" y="18" width="44" height="36" rx="5" fill="#7c3aed"/>
  <rect x="6" y="19" width="40" height="4" rx="2" fill="#fff" opacity="0.3"/>
  <!-- Gold ball bouncing off brick -->
  <circle cx="46" cy="14" r="9" fill="#fcb900"/>
  <circle cx="43" cy="11" r="3" fill="#fff" opacity="0.4"/>

  <!-- BRICKBREAKER wordmark — system fonts only, no web font dependency -->
  <text x="66" y="50" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="800" fill="#212529" letter-spacing="-1">BRICK</text>
  <text x="174" y="50" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="800" fill="#7c3aed" letter-spacing="-1">BREAKER</text>

  <!-- Gold accent line -->
  <rect x="66" y="58" width="200" height="2.5" rx="1.25" fill="#fcb900" opacity="0.75"/>

  <!-- Tagline -->
  <text x="68" y="72" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="600" fill="#6c757d" letter-spacing="3">◆ PLAY FREE ONLINE ◆</text>
</svg>
