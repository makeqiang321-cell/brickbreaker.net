<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <defs>
    <filter id="bglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bglow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bgrad" cx="0.38" cy="0.38" r="0.6">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fcb900"/>
      <stop offset="100%" stop-color="#805000"/>
    </radialGradient>
    <linearGradient id="padgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2d1750"/>
    </linearGradient>
  </defs>

  <!-- Icon badge background -->
  <rect x="2" y="10" width="62" height="62" rx="14" fill="#0a0a15"/>
  <rect x="2" y="10" width="62" height="62" rx="14" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.4"/>

  <!-- Stars -->
  <circle cx="14" cy="19" r="0.6" fill="#c8dcff" opacity="0.5"/>
  <circle cx="30" cy="15" r="0.7" fill="#c8dcff" opacity="0.4"/>
  <circle cx="48" cy="20" r="0.5" fill="#c8dcff" opacity="0.45"/>

  <!-- Brick row: 3 bricks matching game rendering -->
  <!-- Gold brick left -->
  <rect x="7" y="30" width="16" height="10" rx="2" fill="#fcb900" filter="url(#bglow)"/>
  <rect x="7" y="30" width="16" height="10" rx="2" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="0.7"/>
  <rect x="8" y="31" width="14" height="3" fill="rgba(255,255,255,0.14)"/>

  <!-- Purple brick center (cracked) -->
  <rect x="25" y="30" width="16" height="10" rx="2" fill="#7c3aed" filter="url(#bglow)"/>
  <rect x="25" y="30" width="16" height="10" rx="2" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="0.7"/>
  <rect x="26" y="31" width="14" height="3" fill="rgba(255,255,255,0.12)"/>
  <line x1="29" y1="30" x2="35" y2="40" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <line x1="35" y1="30" x2="32" y2="40" stroke="#fff" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

  <!-- Gold brick right -->
  <rect x="43" y="30" width="16" height="10" rx="2" fill="#fcb900" filter="url(#bglow)"/>
  <rect x="43" y="30" width="16" height="10" rx="2" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="0.7"/>
  <rect x="44" y="31" width="14" height="3" fill="rgba(255,255,255,0.14)"/>

  <!-- Paddle -->
  <rect x="14" y="56" width="38" height="8" rx="4" fill="url(#padgrad)" filter="url(#bglow)"/>

  <!-- Ball -->
  <circle cx="47" cy="48" r="6" fill="url(#bgrad)" filter="url(#bglow2)"/>

  <!-- Wordmark -->
  <text x="76" y="47" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="800" fill="#212529" letter-spacing="-1">BRICK</text>
  <text x="178" y="47" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="800" fill="#7c3aed" letter-spacing="-1">BREAKER</text>

  <rect x="76" y="55" width="200" height="2.5" rx="1.25" fill="#fcb900" opacity="0.7"/>

  <text x="78" y="71" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="600" fill="#6c757d" letter-spacing="3">◆ PLAY FREE ONLINE ◆</text>
</svg>
