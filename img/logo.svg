<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <defs>
    <filter id="bg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bb" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="ball" cx="0.38" cy="0.38">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fcb900"/>
      <stop offset="100%" stop-color="#805000"/>
    </radialGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2d1750"/>
    </linearGradient>
  </defs>

  <!-- ═══ Icon: Mini game scene (dark badge, exact game rendering style) ═══ -->
  <!-- Badge bg (dark, like game canvas) -->
  <rect x="2" y="10" width="62" height="62" rx="14" fill="#0a0a15"/>
  <rect x="2" y="10" width="62" height="62" rx="14" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>

  <!-- Starfield -->
  <circle cx="12" cy="20" r="0.5" fill="#c8dcff" opacity="0.5"/>
  <circle cx="28" cy="16" r="0.7" fill="#c8dcff" opacity="0.4"/>
  <circle cx="50" cy="22" r="0.5" fill="#c8dcff" opacity="0.45"/>
  <circle cx="58" cy="14" r="0.6" fill="#c8dcff" opacity="0.35"/>

  <!-- Brick row (3 bricks, like real game grid) -->
  <!-- Left brick (gold) -->
  <g filter="url(#bg)">
   <rect x="7" y="28" width="16" height="9" rx="1.5" fill="#fcb900" opacity="0.9"/>
  </g>
  <rect x="7" y="28" width="16" height="9" rx="1.5" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="0.6"/>
  <rect x="8" y="29" width="14" height="2" fill="rgba(255,255,255,0.14)"/>

  <!-- Center brick (purple, being hit — cracked) -->
  <g filter="url(#bg)">
   <rect x="25" y="28" width="16" height="9" rx="1.5" fill="#7c3aed"/>
  </g>
  <rect x="25" y="28" width="16" height="9" rx="1.5" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="0.6"/>
  <rect x="26" y="29" width="14" height="2" fill="rgba(255,255,255,0.12)"/>
  <!-- Crack -->
  <line x1="29" y1="28" x2="35" y2="37" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="35" y1="28" x2="32" y2="37" stroke="#fff" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

  <!-- Right brick (gold) -->
  <g filter="url(#bg)">
   <rect x="43" y="28" width="16" height="9" rx="1.5" fill="#fcb900" opacity="0.9"/>
  </g>
  <rect x="43" y="28" width="16" height="9" rx="1.5" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="0.6"/>
  <rect x="44" y="29" width="14" height="2" fill="rgba(255,255,255,0.14)"/>

  <!-- Paddle (matching real game gradient) -->
  <g filter="url(#bg)">
   <rect x="14" y="56" width="38" height="8" rx="4" fill="url(#pad)"/>
  </g>

  <!-- Ball (matching real game radial gradient + glow) -->
  <g filter="url(#bb)">
   <circle cx="47" cy="48" r="5.5" fill="url(#ball)"/>
  </g>

  <!-- ═══ Wordmark ═══ -->
  <text x="76" y="47" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="800" fill="#212529" letter-spacing="-1">BRICK</text>
  <text x="178" y="47" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="800" fill="#7c3aed" letter-spacing="-1">BREAKER</text>

  <rect x="76" y="55" width="200" height="2.5" rx="1.25" fill="#fcb900" opacity="0.7"/>

  <text x="78" y="71" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="600" fill="#6c757d" letter-spacing="3">◆ PLAY FREE ONLINE ◆</text>
</svg>
