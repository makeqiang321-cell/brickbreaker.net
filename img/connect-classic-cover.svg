<svg xmlns="http://www.w3.org/2000/svg" width="400" height="322" viewBox="0 0 400 322">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060015"/>
      <stop offset="45%" stop-color="#0d0030"/>
      <stop offset="100%" stop-color="#1a0050"/>
    </linearGradient>
    <radialGradient id="red" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#fca5a5"/><stop offset="55%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/>
    </radialGradient>
    <radialGradient id="yellow" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#fde68a"/><stop offset="55%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/></filter>
    <filter id="winGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060015" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060015" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="400" height="322" fill="url(#bg)"/>

  <!-- board frame -->
  <rect x="62" y="32" width="276" height="236" rx="12" fill="#0b1e4b" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
  <!-- column guides -->
  <g fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="105" y1="32" x2="105" y2="268"/>
    <line x1="143" y1="32" x2="143" y2="268"/>
    <line x1="181" y1="32" x2="181" y2="268"/>
    <line x1="219" y1="32" x2="219" y2="268"/>
    <line x1="257" y1="32" x2="257" y2="268"/>
    <line x1="295" y1="32" x2="295" y2="268"/>
  </g>

  <!-- discs -->
  <g filter="url(#sh)">
    <circle cx="86" cy="207" r="16" fill="url(#red)"/>
    <circle cx="86" cy="245" r="16" fill="url(#yellow)"/>
    <circle cx="124" cy="169" r="16" fill="url(#red)"/>
    <circle cx="124" cy="245" r="16" fill="url(#red)"/>
    <circle cx="162" cy="131" r="16" fill="url(#red)"/>
    <circle cx="162" cy="207" r="16" fill="url(#yellow)"/>
    <circle cx="162" cy="245" r="16" fill="url(#red)"/>
    <circle cx="200" cy="93" r="16" fill="url(#red)"/>
    <circle cx="200" cy="169" r="16" fill="url(#red)"/>
    <circle cx="200" cy="207" r="16" fill="url(#yellow)"/>
    <circle cx="200" cy="245" r="16" fill="url(#yellow)"/>
    <circle cx="238" cy="55" r="16" fill="url(#red)"/>
    <circle cx="238" cy="131" r="16" fill="url(#red)"/>
    <circle cx="238" cy="169" r="16" fill="url(#yellow)"/>
    <circle cx="238" cy="207" r="16" fill="url(#red)"/>
    <circle cx="238" cy="245" r="16" fill="url(#yellow)"/>
    <circle cx="276" cy="93" r="16" fill="url(#red)"/>
    <circle cx="276" cy="131" r="16" fill="url(#yellow)"/>
    <circle cx="276" cy="169" r="16" fill="url(#red)"/>
    <circle cx="276" cy="207" r="16" fill="url(#yellow)"/>
    <circle cx="276" cy="245" r="16" fill="url(#red)"/>
    <circle cx="314" cy="131" r="16" fill="url(#yellow)"/>
    <circle cx="314" cy="169" r="16" fill="url(#red)"/>
    <circle cx="314" cy="207" r="16" fill="url(#yellow)"/>
    <circle cx="314" cy="245" r="16" fill="url(#red)"/>
  </g>

  <!-- winning diagonal (4 yellow) -->
  <g filter="url(#winGlow)">
    <circle cx="124" cy="207" r="16" fill="url(#yellow)"/>
    <circle cx="162" cy="169" r="16" fill="url(#yellow)"/>
    <circle cx="200" cy="131" r="16" fill="url(#yellow)"/>
    <circle cx="238" cy="93" r="16" fill="url(#yellow)"/>
  </g>
  <g fill="#ffffff" opacity="0.4">
    <ellipse cx="120" cy="201" rx="5" ry="4"/>
    <ellipse cx="158" cy="163" rx="5" ry="4"/>
    <ellipse cx="196" cy="125" rx="5" ry="4"/>
    <ellipse cx="234" cy="87" rx="5" ry="4"/>
  </g>

  <!-- title overlay -->
  <rect x="0" y="240" width="400" height="82" fill="url(#titleGrad)"/>
  <text x="200" y="292" text-anchor="middle" fill="#ffffff" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="24" letter-spacing="-0.5">Connect Classic</text>
</svg>
