<svg xmlns="http://www.w3.org/2000/svg" width="400" height="322" viewBox="0 0 400 322">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060015"/>
      <stop offset="45%" stop-color="#0d0030"/>
      <stop offset="100%" stop-color="#1a0050"/>
    </linearGradient>
    <radialGradient id="dough" cx="0.4" cy="0.32" r="1">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="45%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </radialGradient>
    <radialGradient id="glaze" cx="0.5" cy="0.2" r="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.4"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060015" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060015" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="400" height="322" fill="url(#bg)"/>

  <!-- click halo -->
  <circle cx="200" cy="118" r="92" fill="none" stroke="#f472b6" stroke-opacity="0.25" stroke-width="2" filter="url(#glow)"/>

  <!-- donut -->
  <g filter="url(#sh)">
    <circle cx="200" cy="118" r="86" fill="url(#dough)"/>
    <!-- hole -->
    <circle cx="200" cy="118" r="30" fill="#060015"/>
    <circle cx="200" cy="118" r="30" fill="none" stroke="#0d0030" stroke-opacity="0.6" stroke-width="3"/>
    <!-- glaze drip -->
    <path d="M116 100 Q120 132 148 138 Q152 120 130 108 Z" fill="url(#glaze)" opacity="0.9"/>
    <path d="M250 88 Q262 118 288 120 Q288 100 266 92 Z" fill="url(#glaze)" opacity="0.85"/>
    <!-- sprinkles -->
    <g transform="rotate(-20 200 118)">
      <rect x="164" y="40" width="22" height="5" rx="2.5" fill="#22d3ee" transform="rotate(30 175 42)"/>
      <rect x="210" y="34" width="20" height="5" rx="2.5" fill="#a3e635" transform="rotate(-15 220 36)"/>
      <rect x="150" y="74" width="18" height="5" rx="2.5" fill="#fbbf24" transform="rotate(80 159 76)"/>
      <rect x="240" y="66" width="18" height="5" rx="2.5" fill="#a78bfa" transform="rotate(-60 249 68)"/>
      <rect x="176" y="26" width="20" height="5" rx="2.5" fill="#f472b6" transform="rotate(10 186 28)"/>
      <rect x="228" y="90" width="16" height="5" rx="2.5" fill="#34d399" transform="rotate(45 236 92)"/>
      <rect x="138" y="108" width="16" height="5" rx="2.5" fill="#60a5fa" transform="rotate(-30 146 110)"/>
      <rect x="260" y="104" width="18" height="5" rx="2.5" fill="#fb7185" transform="rotate(60 269 106)"/>
    </g>
  </g>
  <!-- highlight -->
  <ellipse cx="172" cy="72" rx="30" ry="18" fill="#ffffff" opacity="0.18"/>

  <!-- +1 click popups -->
  <g font-family="Inter,system-ui,sans-serif" font-weight="800" fill="#00d084" filter="url(#glow)">
    <text x="300" y="60" font-size="20">+1</text>
    <text x="330" y="120" font-size="14" fill="#fbbf24">+1</text>
    <text x="64" y="60" font-size="14" fill="#f472b6">+1</text>
    <text x="96" y="176" font-size="18" fill="#a78bfa">+1</text>
    <text x="306" y="180" font-size="16" fill="#22d3ee">+1</text>
  </g>

  <!-- title overlay -->
  <rect x="0" y="240" width="400" height="82" fill="url(#titleGrad)"/>
  <text x="200" y="292" text-anchor="middle" fill="#ffffff" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="26" letter-spacing="-0.5">Donut Clicker</text>
</svg>
