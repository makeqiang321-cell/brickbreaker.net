<svg xmlns="http://www.w3.org/2000/svg" width="400" height="322" viewBox="0 0 400 322">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060015"/>
      <stop offset="45%" stop-color="#0d0030"/>
      <stop offset="100%" stop-color="#1a0050"/>
    </linearGradient>
    <radialGradient id="pink" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#f9a8d4"/><stop offset="55%" stop-color="#f472b6"/><stop offset="100%" stop-color="#be185d"/>
    </radialGradient>
    <radialGradient id="purple" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#c4b5fd"/><stop offset="55%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <radialGradient id="green" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#6ee7b7"/><stop offset="55%" stop-color="#34d399"/><stop offset="100%" stop-color="#047857"/>
    </radialGradient>
    <radialGradient id="yellow" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#fde68a"/><stop offset="55%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#93c5fd"/><stop offset="55%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
    <radialGradient id="orange" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#fdba74"/><stop offset="55%" stop-color="#fb923c"/><stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/></filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060015" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060015" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="400" height="322" fill="url(#bg)"/>

  <!-- bubble field -->
  <g filter="url(#sh)">
    <circle cx="80" cy="50" r="17" fill="url(#pink)"/>
    <circle cx="130" cy="50" r="17" fill="url(#blue)"/>
    <circle cx="180" cy="50" r="17" fill="url(#green)"/>
    <circle cx="230" cy="50" r="17" fill="url(#yellow)"/>
    <circle cx="280" cy="50" r="17" fill="url(#purple)"/>
    <circle cx="330" cy="50" r="17" fill="url(#orange)"/>
    <circle cx="105" cy="86" r="17" fill="url(#yellow)"/>
    <circle cx="155" cy="86" r="17" fill="url(#orange)"/>
    <circle cx="205" cy="86" r="17" fill="url(#pink)"/>
    <circle cx="255" cy="86" r="17" fill="url(#blue)"/>
    <circle cx="305" cy="86" r="17" fill="url(#green)"/>
    <circle cx="80" cy="122" r="17" fill="url(#purple)"/>
    <circle cx="130" cy="122" r="17" fill="url(#green)"/>
    <circle cx="180" cy="122" r="17" fill="url(#orange)"/>
    <circle cx="230" cy="122" r="17" fill="url(#pink)"/>
    <circle cx="280" cy="122" r="17" fill="url(#yellow)"/>
    <circle cx="330" cy="122" r="17" fill="url(#blue)"/>
  </g>
  <!-- highlights -->
  <g fill="#ffffff" opacity="0.35">
    <ellipse cx="174" cy="44" rx="5" ry="3"/>
    <ellipse cx="224" cy="44" rx="5" ry="3"/>
    <ellipse cx="199" cy="80" rx="5" ry="3"/>
    <ellipse cx="174" cy="116" rx="5" ry="3"/>
  </g>

  <!-- mouse hero -->
  <g filter="url(#sh)">
    <!-- ears -->
    <circle cx="168" cy="168" r="18" fill="#e7cba4" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="232" cy="168" r="18" fill="#e7cba4" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="168" cy="168" r="9" fill="#f472b6"/>
    <circle cx="232" cy="168" r="9" fill="#f472b6"/>
    <!-- head -->
    <circle cx="200" cy="202" r="34" fill="#e7cba4" stroke="#a78bfa" stroke-width="2"/>
    <!-- eyes -->
    <circle cx="186" cy="196" r="5" fill="#1f2937"/>
    <circle cx="214" cy="196" r="5" fill="#1f2937"/>
    <!-- nose -->
    <ellipse cx="200" cy="214" rx="7" ry="5" fill="#f472b6"/>
    <!-- whiskers -->
    <line x1="150" y1="210" x2="178" y2="216" stroke="#c4b5fd" stroke-width="1.5"/>
    <line x1="150" y1="224" x2="178" y2="222" stroke="#c4b5fd" stroke-width="1.5"/>
    <line x1="250" y1="210" x2="222" y2="216" stroke="#c4b5fd" stroke-width="1.5"/>
    <line x1="250" y1="224" x2="222" y2="222" stroke="#c4b5fd" stroke-width="1.5"/>
  </g>

  <!-- title overlay -->
  <rect x="0" y="240" width="400" height="82" fill="url(#titleGrad)"/>
  <text x="200" y="292" text-anchor="middle" fill="#ffffff" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="26" letter-spacing="-0.5">Bubble Mouse</text>
</svg>
