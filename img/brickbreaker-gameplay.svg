  </g>

  <!-- HUD (matching real game: Orbitron font, colored with text-shadow) -->
  <g font-family="Orbitron,monospace" font-weight="700" letter-spacing="1">
    <text x="15" y="22" font-size="15" fill="#fcb900">SCORE</text>
    <text x="90" y="22" font-size="16" font-weight="900" fill="#fcb900">2,450</text>

