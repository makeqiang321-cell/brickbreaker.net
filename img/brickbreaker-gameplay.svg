  <!-- Falling Multi-Ball power-up -->
  <g filter="url(#puGlow)">
    <rect x="386" y="340" width="28" height="28" rx="4" fill="#7c3aed"/>
  </g>
  <rect x="386" y="340" width="28" height="28" rx="4" fill="#7c3aed"/>
  <text x="400" y="360" font-family="Orbitron,monospace" font-size="13" font-weight="700" fill="#000" text-anchor="middle">M</text>

  <!-- Ball with radial gradient -->
