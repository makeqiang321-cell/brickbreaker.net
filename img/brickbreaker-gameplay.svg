  <circle cx="128" cy="68" r="0.8" fill="#c8dcff" opacity="0.3"/>
  <circle cx="203" cy="15" r="1.0" fill="#c8dcff" opacity="0.4"/>
  <circle cx="345" cy="42" r="0.6" fill="#c8dcff" opacity="0.25"/>
  <circle cx="467" cy="18" r="1.1" fill="#c8dcff" opacity="0.35"/>
  <circle cx="580" cy="55" r="0.7" fill="#c8dcff" opacity="0.3"/>
  <circle cx="634" cy="28" r="1.3" fill="#c8dcff" opacity="0.4"/>
  <circle cx="712" cy="72" r="0.9" fill="#c8dcff" opacity="0.25"/>
  <circle cx="760" cy="12" r="1.0" fill="#c8dcff" opacity="0.3"/>
  <circle cx="89" cy="118" r="0.7" fill="#c8dcff" opacity="0.2"/>
  <circle cx="678" cy="132" r="0.8" fill="#c8dcff" opacity="0.25"/>
