<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="fg"><feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="fg2"><feGaussianBlur stdDeviation="8"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="ballG" cx="0.35" cy="0.35"><stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#fcb900"/><stop offset="100%" stop-color="#805000"/></radialGradient>
    <linearGradient id="paddleGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#2d1750"/></linearGradient>
  </defs>

  <!-- Black background -->
  <rect width="800" height="600" fill="#000000"/>

  <!-- Starfield -->
  <g fill="#c8dcff">
    <circle cx="50" cy="25" r="0.9" opacity="0.3"/><circle cx="160" cy="55" r="0.7" opacity="0.25"/>
    <circle cx="290" cy="15" r="1" opacity="0.35"/><circle cx="430" cy="40" r="0.6" opacity="0.2"/>
    <circle cx="560" cy="20" r="0.8" opacity="0.3"/><circle cx="700" cy="50" r="1.1" opacity="0.35"/>
    <circle cx="760" cy="30" r="0.7" opacity="0.25"/><circle cx="20" cy="80" r="0.8" opacity="0.2"/>
  </g>

  <!-- Part 1: Full brick grid + gameplay (top half) -->
  <!-- HUD -->
  <g font-family="Orbitron,monospace" font-weight="700" letter-spacing="1">
    <text x="15" y="20" font-size="14" fill="#fcb900">SCORE: 1,850</text>
    <text x="330" y="20" font-size="14" fill="#0693e3">♥ ♥ ♥</text>
    <text x="650" y="20" font-size="14" fill="#a78bfa">HI: 8,200</text>
  </g>

  <!-- Brick grid (compact 5 rows × 10 cols) -->
  <g filter="url(#fg)">
    <!-- Row 1: Gold -->
    <rect x="8" y="50" width="74" height="22" rx="2" fill="#fcb900" opacity="0.88"/>
    <rect x="86" y="50" width="74" height="22" rx="2" fill="#fcb900" opacity="0.88"/>
    <rect x="164" y="50" width="74" height="22" rx="2" fill="#fcb900" opacity="0.88"/>
    <rect x="242" y="50" width="74" height="22" rx="2" fill="#fcb900" opacity="0.88"/>
    <rect x="320" y="50" width="74" height="22" rx="2" fill="#fcb900" opacity="0.88"/>
    <rect x="398" y="50" width="74" height="22" rx="2" fill="#fcb900" opacity="0.88"/>
    <rect x="476" y="50" width="74" height="22" rx="2" fill="#fcb900" opacity="0.88"/>
    <rect x="554" y="50" width="74" height="22" rx="2" fill="#fcb900" opacity="0.88"/>
    <rect x="632" y="50" width="74" height="22" rx="2" fill="#fcb900" opacity="0.88"/>
    <rect x="710" y="50" width="74" height="22" rx="2" fill="#fcb900" opacity="0.88"/>

    <!-- Row 2: Purple -->
    <rect x="8" y="76" width="74" height="22" rx="2" fill="#7c3aed"/>
    <rect x="86" y="76" width="74" height="22" rx="2" fill="#7c3aed"/>
    <rect x="164" y="76" width="74" height="22" rx="2" fill="#7c3aed"/>
    <rect x="242" y="76" width="74" height="22" rx="2" fill="#7c3aed"/>
    <rect x="320" y="76" width="74" height="22" rx="2" fill="#7c3aed"/>
    <rect x="398" y="76" width="74" height="22" rx="2" fill="#7c3aed"/>
    <rect x="476" y="76" width="74" height="22" rx="2" fill="#7c3aed"/>
    <rect x="554" y="76" width="74" height="22" rx="2" fill="#7c3aed"/>
    <rect x="632" y="76" width="74" height="22" rx="2" fill="#7c3aed"/>
    <rect x="710" y="76" width="74" height="22" rx="2" fill="#7c3aed"/>

    <!-- Row 3: Strong (light purple) -->
    <rect x="8" y="102" width="74" height="22" rx="2" fill="#a78bfa"/>
    <rect x="86" y="102" width="74" height="22" rx="2" fill="#a78bfa"/>
    <rect x="164" y="102" width="74" height="22" rx="2" fill="#a78bfa"/>
    <rect x="242" y="102" width="74" height="22" rx="2" fill="#a78bfa"/>
    <rect x="320" y="102" width="74" height="22" rx="2" fill="#a78bfa"/>
    <rect x="398" y="102" width="74" height="22" rx="2" fill="#a78bfa"/>
    <rect x="476" y="102" width="74" height="22" rx="2" fill="#a78bfa"/>
    <rect x="554" y="102" width="74" height="22" rx="2" fill="#a78bfa"/>
    <rect x="632" y="102" width="74" height="22" rx="2" fill="#a78bfa"/>
    <rect x="710" y="102" width="74" height="22" rx="2" fill="#a78bfa"/>
  </g>
  <!-- Borders + shine -->
  <g stroke="rgba(0,0,0,0.35)" stroke-width="0.7">
    <rect x="8" y="50" width="74" height="22" rx="2" fill="none"/>
    <rect x="86" y="50" width="74" height="22" rx="2" fill="none"/>
    <rect x="164" y="50" width="74" height="22" rx="2" fill="none"/>
    <rect x="242" y="50" width="74" height="22" rx="2" fill="none"/>
    <rect x="320" y="50" width="74" height="22" rx="2" fill="none"/>
    <rect x="398" y="50" width="74" height="22" rx="2" fill="none"/>
    <rect x="476" y="50" width="74" height="22" rx="2" fill="none"/>
    <rect x="554" y="50" width="74" height="22" rx="2" fill="none"/>
    <rect x="632" y="50" width="74" height="22" rx="2" fill="none"/>
    <rect x="710" y="50" width="74" height="22" rx="2" fill="none"/>
  </g>
  <!-- Shine strips (each brick top highlight) -->
  <g fill="rgba(255,255,255,0.12)">
    <rect x="9" y="51" width="72" height="3"/><rect x="87" y="51" width="72" height="3"/><rect x="165" y="51" width="72" height="3"/>
    <rect x="243" y="51" width="72" height="3"/><rect x="321" y="51" width="72" height="3"/><rect x="399" y="51" width="72" height="3"/>
    <rect x="477" y="51" width="72" height="3"/><rect x="555" y="51" width="72" height="3"/><rect x="633" y="51" width="72" height="3"/>
    <rect x="711" y="51" width="72" height="3"/>
  </g>

  <!-- Paddle -->
  <g filter="url(#fg)">
    <rect x="290" y="155" width="220" height="12" rx="5" fill="url(#paddleGrad)"/>
  </g>
  <!-- Ball -->
  <g filter="url(#fg2)">
    <circle cx="400" cy="140" r="6" fill="url(#ballG)"/>
  </g>

  <!-- Divider line -->
  <rect x="20" y="185" width="760" height="1" fill="#7c3aed" opacity="0.3"/>

  <!-- Part 2: Feature showcase (bottom half) -->
  <!-- Brick Type Cards -->
  <g font-family="Orbitron,monospace" font-weight="700">
    <text x="30" y="210" font-size="13" fill="#a78bfa" letter-spacing="1">◆ BRICK TYPES ◆</text>

    <!-- Normal -->
    <g filter="url(#fg)">
      <rect x="30" y="225" width="160" height="32" rx="3" fill="#7c3aed"/>
    </g>
    <rect x="30" y="225" width="160" height="32" rx="3" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="0.8"/>
    <text x="110" y="246" font-size="13" fill="#fff" text-anchor="middle" letter-spacing="1">NORMAL</text>
    <text x="110" y="275" font-size="11" fill="#6c757d" text-anchor="middle" font-family="Inter,system-ui,sans-serif">1 hit · 10 pts</text>

    <!-- Strong -->
    <g filter="url(#fg)">
      <rect x="215" y="225" width="160" height="32" rx="3" fill="#a78bfa"/>
    </g>
    <rect x="215" y="225" width="160" height="32" rx="3" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="0.8"/>
    <text x="295" y="246" font-size="13" fill="#fff" text-anchor="middle" letter-spacing="1">STRONG</text>
    <text x="295" y="275" font-size="11" fill="#6c757d" text-anchor="middle" font-family="Inter,system-ui,sans-serif">2 hits · 20 pts</text>

    <!-- Gold -->
    <g filter="url(#fg)">
      <rect x="400" y="225" width="160" height="32" rx="3" fill="#fcb900" opacity="0.9"/>
    </g>
    <rect x="400" y="225" width="160" height="32" rx="3" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="0.8"/>
    <text x="480" y="246" font-size="13" fill="#1a1a2e" text-anchor="middle" letter-spacing="1">GOLD</text>
    <text x="480" y="275" font-size="11" fill="#6c757d" text-anchor="middle" font-family="Inter,system-ui,sans-serif">1 hit · 50 pts</text>

    <!-- Steel -->
    <g filter="url(#fg)">
      <rect x="585" y="225" width="160" height="32" rx="3" fill="#333333"/>
    </g>
    <rect x="585" y="225" width="160" height="32" rx="3" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="0.8"/>
    <text x="665" y="246" font-size="13" fill="#8899aa" text-anchor="middle" letter-spacing="1">STEEL</text>
    <text x="665" y="275" font-size="11" fill="#6c757d" text-anchor="middle" font-family="Inter,system-ui,sans-serif">indestructible</text>
  </g>

  <!-- Power-up Cards -->
  <g font-family="Orbitron,monospace" font-weight="700">
    <text x="30" y="315" font-size="13" fill="#a78bfa" letter-spacing="1">◆ POWER-UPS (15% drop) ◆</text>

    <!-- W: Big Paddle -->
    <g filter="url(#fg)">
      <rect x="30" y="330" width="28" height="28" rx="4" fill="#00d084"/>
    </g>
    <text x="44" y="351" font-size="22" fill="#000" text-anchor="middle">W</text>
    <text x="72" y="349" font-size="12" fill="#fff" letter-spacing="1">BIG PADDLE</text>
    <text x="72" y="364" font-size="10" fill="#6c757d" font-family="Inter,system-ui,sans-serif">8s · width +60%</text>

    <!-- M: Multi-Ball -->
    <g filter="url(#fg)">
      <rect x="210" y="330" width="28" height="28" rx="4" fill="#7c3aed"/>
    </g>
    <text x="224" y="351" font-size="22" fill="#000" text-anchor="middle">M</text>
    <text x="252" y="349" font-size="12" fill="#fff" letter-spacing="1">MULTI-BALL</text>
    <text x="252" y="364" font-size="10" fill="#6c757d" font-family="Inter,system-ui,sans-serif">3× simultaneous balls</text>

    <!-- +: Extra Life -->
    <g filter="url(#fg)">
      <rect x="420" y="330" width="28" height="28" rx="4" fill="#0693e3"/>
    </g>
    <text x="434" y="351" font-size="24" fill="#000" text-anchor="middle">+</text>
    <text x="462" y="349" font-size="12" fill="#fff" letter-spacing="1">EXTRA LIFE</text>
    <text x="462" y="364" font-size="10" fill="#6c757d" font-family="Inter,system-ui,sans-serif">rarest drop</text>
  </g>

  <!-- Controls section -->
  <g font-family="Orbitron,monospace" font-weight="700">
    <text x="30" y="410" font-size="13" fill="#a78bfa" letter-spacing="1">◆ CONTROLS ◆</text>

    <rect x="30" y="422" width="230" height="60" rx="6" fill="#111" stroke="#333" stroke-width="1"/>
    <text x="145" y="450" font-family="Inter,system-ui,sans-serif" font-size="28" text-anchor="middle">🖱️</text>
    <text x="145" y="472" font-size="10" fill="#8899aa" text-anchor="middle" font-family="Inter,system-ui,sans-serif">Mouse / Touch Drag</text>

    <rect x="285" y="422" width="230" height="60" rx="6" fill="#111" stroke="#333" stroke-width="1"/>
    <text x="400" y="450" font-family="Inter,system-ui,sans-serif" font-size="28" text-anchor="middle">⌨️</text>
    <text x="400" y="472" font-size="10" fill="#8899aa" text-anchor="middle" font-family="Inter,system-ui,sans-serif">Arrow Keys / A · D</text>

    <rect x="540" y="422" width="230" height="60" rx="6" fill="#111" stroke="#333" stroke-width="1"/>
    <text x="655" y="450" font-family="Inter,system-ui,sans-serif" font-size="28" text-anchor="middle">⚡</text>
    <text x="655" y="472" font-size="10" fill="#8899aa" text-anchor="middle" font-family="Inter,system-ui,sans-serif">F/R/S Shortcuts</text>
  </g>

  <!-- Physics angle demo (mini scene) -->
  <g font-family="Orbitron,monospace" font-weight="700">
    <text x="30" y="525" font-size="13" fill="#a78bfa" letter-spacing="1">◆ ANGLE PHYSICS (120° exit) ◆</text>

    <!-- Mini paddle render -->
    <rect x="160" y="575" width="480" height="10" rx="5" fill="url(#paddleGrad)" filter="url(#fg)"/>

    <!-- Ball at center -->
    <circle cx="400" cy="560" r="5" fill="url(#ballG)" filter="url(#fg2)"/>

    <!-- Trajectory lines from paddle surface -->
    <g stroke="#fcb900" stroke-width="0.8" opacity="0.35" stroke-dasharray="3,3">
      <line x1="170" y1="575" x2="130" y2="540"/>
      <line x1="210" y1="575" x2="170" y2="530"/>
      <line x1="270" y1="575" x2="260" y2="520"/>
      <line x1="340" y1="575" x2="360" y2="515"/>
      <line x1="400" y1="575" x2="400" y2="510"/>
      <line x1="460" y1="575" x2="440" y2="515"/>
      <line x1="530" y1="575" x2="540" y2="520"/>
      <line x1="590" y1="575" x2="630" y2="530"/>
      <line x1="630" y1="575" x2="670" y2="540"/>
    </g>

    <!-- Angle arc -->
    <path d="M 180 575 Q 400 505 620 575" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.25"/>
  </g>
</svg>
