<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="glowPink"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowCyan"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowGold"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowPurple"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowGreen"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f0f23"/><stop offset="100%" stop-color="#141430"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <!-- Stars -->
  <circle cx="60" cy="45" r="1" fill="#aabbcc" opacity="0.5"/>
  <circle cx="180" cy="30" r="1.5" fill="#8899bb" opacity="0.6"/>
  <circle cx="400" cy="50" r="1" fill="#aabbcc" opacity="0.4"/>
  <circle cx="600" cy="40" r="1.5" fill="#8899bb" opacity="0.5"/>
  <circle cx="740" cy="55" r="1" fill="#aabbcc" opacity="0.6"/>

  <!-- Level Complete banner -->
  <text x="400" y="80" font-family="monospace" font-size="32" font-weight="bold" fill="#fff" text-anchor="middle" filter="url(#glowGold)">LEVEL 12 COMPLETE!</text>
  <text x="400" y="110" font-family="monospace" font-size="16" fill="#aabbcc" text-anchor="middle">+2,400 BONUS POINTS</text>

  <!-- Feature showcase: 4 brick types -->
  <rect x="60" y="150" width="130" height="40" rx="4" fill="#ff2d78" opacity="0.8" filter="url(#glowPink)"/>
  <text x="125" y="176" font-family="monospace" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">NORMAL</text>
  <text x="125" y="210" font-family="monospace" font-size="11" fill="#7888a8" text-anchor="middle">1 hit · 10 pts</text>

  <rect x="240" y="150" width="130" height="40" rx="4" fill="#ff8800" opacity="0.8"/>
  <text x="305" y="176" font-family="monospace" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">STRONG</text>
  <text x="305" y="210" font-family="monospace" font-size="11" fill="#7888a8" text-anchor="middle">2 hits · 20 pts</text>

  <rect x="420" y="150" width="130" height="40" rx="4" fill="#ffd700" opacity="0.9" filter="url(#glowGold)"/>
  <text x="485" y="176" font-family="monospace" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">GOLD</text>
  <text x="485" y="210" font-family="monospace" font-size="11" fill="#665500" text-anchor="middle">1 hit · 50 pts</text>

  <rect x="600" y="150" width="130" height="40" rx="4" fill="#4a5570" opacity="0.6"/>
  <text x="665" y="176" font-family="monospace" font-size="14" font-weight="bold" fill="#8899aa" text-anchor="middle">STEEL</text>
  <text x="665" y="210" font-family="monospace" font-size="11" fill="#7888a8" text-anchor="middle">unbreakable</text>

  <!-- Power-ups showcase -->
  <text x="400" y="270" font-family="monospace" font-size="18" font-weight="bold" fill="#00d4ff" text-anchor="middle" filter="url(#glowCyan)">◆ POWER-UPS ◆</text>

  <!-- Big Paddle -->
  <rect x="100" y="300" width="160" height="80" rx="8" fill="rgba(57,255,20,0.08)" stroke="rgba(57,255,20,0.2)"/>
  <text x="180" y="330" font-family="monospace" font-size="40" font-weight="bold" fill="#39ff14" text-anchor="middle" filter="url(#glowGreen)">W</text>
  <text x="180" y="360" font-family="monospace" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">BIG PADDLE</text>

  <!-- Multi Ball -->
  <rect x="320" y="300" width="160" height="80" rx="8" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.2)"/>
  <text x="400" y="330" font-family="monospace" font-size="40" font-weight="bold" fill="#00d4ff" text-anchor="middle" filter="url(#glowCyan)">M</text>
  <text x="400" y="360" font-family="monospace" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">MULTI-BALL</text>

  <!-- Extra Life -->
  <rect x="540" y="300" width="160" height="80" rx="8" fill="rgba(255,45,120,0.08)" stroke="rgba(255,45,120,0.2)"/>
  <text x="620" y="330" font-family="monospace" font-size="40" font-weight="bold" fill="#ff2d78" text-anchor="middle" filter="url(#glowPink)">+</text>
  <text x="620" y="360" font-family="monospace" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">EXTRA LIFE</text>

  <!-- High Score banner -->
  <rect x="200" y="430" width="400" height="50" rx="6" fill="rgba(180,77,255,0.08)" stroke="rgba(180,77,255,0.2)"/>
  <text x="400" y="460" font-family="monospace" font-size="18" font-weight="bold" fill="#b44dff" text-anchor="middle" filter="url(#glowPurple)">🏆 HIGH SCORE: 12,450 🏆</text>

  <!-- Play now CTA -->
  <rect x="280" y="520" width="240" height="44" rx="6" fill="rgba(0,212,255,0.1)" stroke="#00d4ff" stroke-width="2"/>
  <text x="400" y="548" font-family="monospace" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">▶ PLAY NOW</text>

  <!-- Scanlines -->
  <pattern id="scanlines" width="800" height="4" patternUnits="userSpaceOnUse">
    <rect x="0" y="0" width="800" height="2" fill="rgba(0,0,0,0.04)"/>
    <rect x="0" y="2" width="800" height="2" fill="transparent"/>
  </pattern>
  <rect width="800" height="600" fill="url(#scanlines)" pointer-events="none"/>
</svg>
