<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7c3aed" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa"/>
  <rect x="0" y="0" width="800" height="600" fill="url(#grid3)" opacity="0.03"/>

  <!-- Game area border -->
  <rect x="30" y="40" width="740" height="525" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="72" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="800" fill="#7c3aed" text-anchor="middle">◆ BRICKBREAKER FEATURES ◆</text>

  <!-- ═══════════════ Row 1: 4 Brick Types ═══════════════ -->
  <text x="60" y="110" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#212529">BRICK TYPES</text>

  <!-- Normal Brick -->
  <rect x="60" y="125" width="140" height="36" rx="4" fill="#7c3aed"/>
  <text x="130" y="149" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">NORMAL</text>
  <text x="130" y="180" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">1 hit · 10 pts</text>

  <!-- Strong Brick -->
  <rect x="230" y="125" width="140" height="36" rx="4" fill="#a78bfa"/>
  <text x="300" y="149" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">STRONG</text>
  <text x="300" y="180" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">2 hits · 20 pts</text>

  <!-- Gold Brick -->
  <rect x="400" y="125" width="140" height="36" rx="4" fill="#fcb900"/>
  <text x="470" y="149" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">GOLD</text>
  <text x="470" y="180" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">1 hit · 50 pts</text>

  <!-- Steel Brick -->
  <rect x="570" y="125" width="140" height="36" rx="4" fill="#adb5bd"/>
  <text x="640" y="149" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">STEEL</text>
  <text x="640" y="180" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">indestructible</text>

  <!-- ═══════════════ Row 2: 3 Power-Ups ═══════════════ -->
  <text x="60" y="225" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#212529">POWER-UPS (15% drop chance per brick)</text>

  <!-- Big Paddle -->
  <rect x="60" y="240" width="200" height="90" rx="8" fill="#f0fdf4" stroke="#00d084" stroke-width="1.5"/>
  <text x="160" y="275" font-family="Inter,system-ui,sans-serif" font-size="36" font-weight="800" fill="#00d084" text-anchor="middle">W</text>
  <text x="160" y="300" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#212529" text-anchor="middle">BIG PADDLE</text>
  <text x="160" y="318" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">8s · paddle width +60%</text>

  <!-- Multi-Ball -->
  <rect x="300" y="240" width="200" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="400" y="275" font-family="Inter,system-ui,sans-serif" font-size="36" font-weight="800" fill="#7c3aed" text-anchor="middle">M</text>
  <text x="400" y="300" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#212529" text-anchor="middle">MULTI-BALL</text>
  <text x="400" y="318" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">splits into 3 balls</text>

  <!-- Extra Life -->
  <rect x="540" y="240" width="200" height="90" rx="8" fill="#eff6ff" stroke="#0693e3" stroke-width="1.5"/>
  <text x="640" y="275" font-family="Inter,system-ui,sans-serif" font-size="36" font-weight="800" fill="#0693e3" text-anchor="middle">+</text>
  <text x="640" y="300" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#212529" text-anchor="middle">EXTRA LIFE</text>
  <text x="640" y="318" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">rarest drop</text>

  <!-- ═══════════════ Row 3: Controls ═══════════════ -->
  <text x="60" y="385" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#212529">CONTROLS</text>

  <rect x="60" y="400" width="220" height="70" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="170" y="430" font-family="Inter,system-ui,sans-serif" font-size="20" fill="#212529" text-anchor="middle">🖱️</text>
  <text x="170" y="455" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#6c757d" text-anchor="middle">Mouse / Touch Drag</text>

  <rect x="310" y="400" width="220" height="70" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="420" y="430" font-family="Inter,system-ui,sans-serif" font-size="20" fill="#212529" text-anchor="middle">⌨️</text>
  <text x="420" y="455" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#6c757d" text-anchor="middle">Arrow Keys / A · D</text>

  <rect x="560" y="400" width="200" height="70" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="660" y="430" font-family="Inter,system-ui,sans-serif" font-size="20" fill="#212529" text-anchor="middle">⚡</text>
  <text x="660" y="455" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#6c757d" text-anchor="middle">F/R/S Shortcuts</text>

  <!-- ═══════════════ Row 4: Mini game scene ═══════════════ -->
  <text x="60" y="515" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#212529">PHYSICS DEMO</text>

  <!-- Mini scene -->
  <rect x="60" y="525" width="700" height="62" rx="6" fill="#f5f5f7"/>

  <!-- Angle labels -->
  <text x="120" y="515" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#6c757d" text-anchor="middle">~120° exit angles</text>

  <!-- Paddle -->
  <rect x="280" y="568" width="240" height="10" rx="5" fill="#7c3aed"/>

  <!-- Ball at center (straight up) -->
  <circle cx="400" cy="545" r="5" fill="#fcb900"/>

  <!-- Ball trajectory lines from paddle surface -->
  <line x1="310" y1="568" x2="260" y2="530" stroke="#fcb900" stroke-width="1" opacity="0.4" stroke-dasharray="4,2"/>
  <line x1="340" y1="568" x2="300" y2="525" stroke="#fcb900" stroke-width="1" opacity="0.4" stroke-dasharray="4,2"/>
  <line x1="370" y1="568" x2="370" y2="515" stroke="#fcb900" stroke-width="1" opacity="0.6" stroke-dasharray="4,2"/>
  <line x1="400" y1="568" x2="400" y2="510" stroke="#fcb900" stroke-width="1" opacity="0.6" stroke-dasharray="4,2"/>
  <line x1="430" y1="568" x2="430" y2="515" stroke="#fcb900" stroke-width="1" opacity="0.6" stroke-dasharray="4,2"/>
  <line x1="460" y1="568" x2="500" y2="525" stroke="#fcb900" stroke-width="1" opacity="0.4" stroke-dasharray="4,2"/>
  <line x1="490" y1="568" x2="540" y2="530" stroke="#fcb900" stroke-width="1" opacity="0.4" stroke-dasharray="4,2"/>

  <!-- Angle arc indicator -->
  <path d="M 310 568 Q 400 510 490 568" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
</svg>
