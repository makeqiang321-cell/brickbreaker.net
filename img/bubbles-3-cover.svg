<svg xmlns="http://www.w3.org/2000/svg" width="400" height="322" viewBox="0 0 400 322">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060015"/>
      <stop offset="45%" stop-color="#0d0030"/>
      <stop offset="100%" stop-color="#1a0050"/>
    </linearGradient>
    <radialGradient id="pink" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#f9a8d4"/><stop offset="55%" stop-color="#f472b6"/><stop offset="100%" stop-color="#be185d"/>
    </radialGradient>
    <radialGradient id="purple" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#c4b5fd"/><stop offset="55%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <radialGradient id="green" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#6ee7b7"/><stop offset="55%" stop-color="#34d399"/><stop offset="100%" stop-color="#047857"/>
    </radialGradient>
    <radialGradient id="yellow" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#fde68a"/><stop offset="55%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#93c5fd"/><stop offset="55%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
    <radialGradient id="orange" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#fdba74"/><stop offset="55%" stop-color="#fb923c"/><stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/></filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060015" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060015" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="400" height="322" fill="url(#bg)"/>

  <!-- bubble field (descending) -->
  <g filter="url(#sh)">
    <circle cx="80" cy="48" r="19" fill="url(#pink)"/>
    <circle cx="130" cy="48" r="19" fill="url(#blue)"/>
    <circle cx="180" cy="48" r="19" fill="url(#green)"/>
    <circle cx="230" cy="48" r="19" fill="url(#yellow)"/>
    <circle cx="280" cy="48" r="19" fill="url(#purple)"/>
    <circle cx="330" cy="48" r="19" fill="url(#orange)"/>
    <circle cx="105" cy="86" r="19" fill="url(#yellow)"/>
    <circle cx="155" cy="86" r="19" fill="url(#orange)"/>
    <circle cx="205" cy="86" r="19" fill="url(#pink)"/>
    <circle cx="255" cy="86" r="19" fill="url(#blue)"/>
    <circle cx="305" cy="86" r="19" fill="url(#green)"/>
    <circle cx="80" cy="124" r="19" fill="url(#purple)"/>
    <circle cx="130" cy="124" r="19" fill="url(#green)"/>
    <circle cx="180" cy="124" r="19" fill="url(#orange)"/>
    <circle cx="230" cy="124" r="19" fill="url(#pink)"/>
    <circle cx="280" cy="124" r="19" fill="url(#yellow)"/>
    <circle cx="330" cy="124" r="19" fill="url(#blue)"/>
    <circle cx="105" cy="162" r="19" fill="url(#blue)"/>
    <circle cx="155" cy="162" r="19" fill="url(#purple)"/>
    <circle cx="205" cy="162" r="19" fill="url(#yellow)"/>
    <circle cx="255" cy="162" r="19" fill="url(#green)"/>
    <circle cx="305" cy="162" r="19" fill="url(#orange)"/>
  </g>
  <!-- highlights -->
  <g fill="#ffffff" opacity="0.35">
    <ellipse cx="174" cy="42" rx="6" ry="4"/>
    <ellipse cx="224" cy="42" rx="6" ry="4"/>
    <ellipse cx="199" cy="80" rx="6" ry="4"/>
    <ellipse cx="174" cy="118" rx="6" ry="4"/>
    <ellipse cx="199" cy="156" rx="6" ry="4"/>
  </g>

  <!-- aim line -->
  <line x1="200" y1="252" x2="180" y2="124" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 5" opacity="0.7"/>

  <!-- launcher -->
  <g>
    <circle cx="200" cy="272" r="22" fill="#6d28d9" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="200" cy="272" r="15" fill="url(#pink)"/>
    <ellipse cx="194" cy="266" rx="4" ry="3" fill="#ffffff" opacity="0.45"/>
    <path d="M200 236 L210 258 L200 252 L190 258 Z" fill="#a78bfa"/>
  </g>

  <!-- title overlay -->
  <rect x="0" y="240" width="400" height="82" fill="url(#titleGrad)"/>
  <text x="200" y="292" text-anchor="middle" fill="#ffffff" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="24" letter-spacing="-0.5">Bubbles 3</text>
</svg>
