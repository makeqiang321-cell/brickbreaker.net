<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Image Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0f23;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 1200px;
            height: 630px;
            background: #0f0f23;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(0,212,255,0.2);
        }

        /* Starfield */
        .stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* Main title */
        .main-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 52px;
            color: #fff;
            letter-spacing: 6px;
            text-align: center;
            text-shadow:
                0 0 10px #00d4ff,
                0 0 30px #00d4ff,
                0 0 60px #ff2d78,
                0 0 100px #ff2d78;
            margin-bottom: 24px;
            line-height: 1.4;
            z-index: 1;
        }

        .subtitle {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            font-weight: 700;
            color: #ffd700;
            letter-spacing: 8px;
            text-shadow: 0 0 15px rgba(255,215,0,0.6);
            margin-bottom: 32px;
            z-index: 1;
        }

        .tagline {
            font-family: 'Orbitron', monospace;
            font-size: 20px;
            color: #7888a8;
            letter-spacing: 4px;
            z-index: 1;
        }

        .bricks-row {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            z-index: 1;
        }

        .brick {
            width: 80px;
            height: 30px;
            border-radius: 3px;
            box-shadow: 0 0 12px currentColor;
        }

        .brick-pink  { background: #ff2d78; color: #ff2d78; }
        .brick-cyan  { background: #00d4ff; color: #00d4ff; }
        .brick-gold  { background: #ffd700; color: #ffd700; }
        .brick-purple{ background: #b44dff; color: #b44dff; }
        .brick-green { background: #39ff14; color: #39ff14; }

        .url-line {
            font-family: 'Orbitron', monospace;
            font-size: 16px;
            color: rgba(0,212,255,0.5);
            letter-spacing: 4px;
            position: absolute;
            bottom: 36px;
            z-index: 1;
        }

        /* Scanlines */
        .scanlines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.04) 2px,
                rgba(0,0,0,0.04) 4px
            );
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Starfield -->
        <canvas class="stars" id="starCanvas"></canvas>

        <div class="bricks-row">
            <div class="brick brick-pink"></div>
            <div class="brick brick-cyan"></div>
            <div class="brick brick-gold"></div>
            <div class="brick brick-purple"></div>
            <div class="brick brick-green"></div>
        </div>

        <div class="main-title">BRICK<br>BREAKER</div>
        <div class="subtitle">◆ RETRO ARCADE ◆</div>
        <div class="tagline">PLAY ONLINE FREE  ·  NO DOWNLOAD</div>

        <div class="url-line">brickbreaker.net</div>
        <div class="scanlines"></div>
    </div>

    <script>
        var canvas = document.getElementById('starCanvas');
        canvas.width = 1200;
        canvas.height = 630;
        var ctx = canvas.getContext('2d');
        for (var i = 0; i < 80; i++) {
            var x = Math.random() * 1200;
            var y = Math.random() * 630;
            var r = Math.random() * 1.5 + 0.3;
            var a = Math.random() * 0.5 + 0.1;
            ctx.fillStyle = 'rgba(200,220,255,' + a + ')';
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }
    </script>
</body>
</html>
