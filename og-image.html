<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Image Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ede9fe;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #f8f9fa, #ede9fe);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(124,58,237,0.15);
            border-radius: 8px;
        }

        .dots {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .main-title {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 64px;
            font-weight: 800;
            color: #212529;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.3;
            z-index: 1;
        }

        .accent-line {
            width: 400px;
            height: 6px;
            background: linear-gradient(90deg, #7c3aed, #6d28d9);
            border-radius: 3px;
            margin-bottom: 24px;
            z-index: 1;
        }

        .subtitle {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #7c3aed;
            letter-spacing: 6px;
            margin-bottom: 28px;
            z-index: 1;
        }

        .tagline {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 18px;
            color: #6c757d;
            letter-spacing: 3px;
            z-index: 1;
        }

        .bricks-row {
            display: flex;
            gap: 14px;
            margin-bottom: 30px;
            z-index: 1;
        }

        .brick {
            width: 80px;
            height: 30px;
            border-radius: 4px;
        }

        .brick-purple1 { background: #7c3aed; }
        .brick-blue    { background: #0693e3; }
        .brick-gold    { background: #fcb900; }
        .brick-purple2 { background: #a78bfa; }
        .brick-green   { background: #00d084; }

        .url-line {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: rgba(124,58,237,0.4);
            letter-spacing: 3px;
            position: absolute;
            bottom: 36px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="card">
        <canvas class="dots" id="dotCanvas"></canvas>

        <div class="bricks-row">
            <div class="brick brick-purple1"></div>
            <div class="brick brick-blue"></div>
            <div class="brick brick-gold"></div>
            <div class="brick brick-purple2"></div>
            <div class="brick brick-green"></div>
        </div>

        <div class="main-title">BRICK<br>BREAKER</div>
        <div class="accent-line"></div>
        <div class="subtitle">◆ PLAY ONLINE FREE ◆</div>
        <div class="tagline">NO DOWNLOAD  ·  INSTANT PLAY  ·  ALL DEVICES</div>

        <div class="url-line">brickbreaker.net</div>
    </div>

    <script>
        var canvas = document.getElementById('dotCanvas');
        canvas.width = 1200;
        canvas.height = 630;
        var ctx = canvas.getContext('2d');
        var colors = ['rgba(124,58,237,0.1)', 'rgba(6,147,227,0.08)', 'rgba(252,185,0,0.08)', 'rgba(0,208,132,0.06)'];
        for (var i = 0; i < 60; i++) {
            var x = Math.random() * 1200;
            var y = Math.random() * 630;
            var r = Math.random() * 5 + 1;
            ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }
    </script>
</body>
</html>
